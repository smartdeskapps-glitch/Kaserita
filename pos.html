<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaserita - Punto de Venta</title>

  <!-- PWA: instalable como app en el celular ("Agregar a pantalla de inicio") -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f3fd">
  <!-- Sin esto, Chrome en Android con modo oscuro del sistema "fuerza"
       su propio oscurecimiento sobre fondos sin color explícito -- se ve
       como franjas negras en las esquinas redondeadas del login. -->
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaserita">

  <link rel="stylesheet" href="/src/index.css">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- media="print" + /estilos-diferidos.js: la hoja se baja sin bloquear el primer dibujo de la pantalla -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" data-diferido>

  <!-- Íconos de línea (Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" data-diferido>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </noscript>

  <!-- React, Supabase y el bundle de la app: compilados por Vite (ver src/main.jsx) -->

  <!-- Canvas Confetti, jsPDF, zxing-wasm y XLSX (SheetJS) NO se cargan acá.
       Son pesadas y cada bodega usa una sola de ellas de vez en cuando (una
       imprime boletas por Bluetooth, otra nunca exporta a Excel, etc.) --
       cargarlas siempre de entrada demoraba el arranque en celulares de gama
       baja para funciones que la mayoría de las veces no se van a tocar en
       esa sesión. Se cargan solas, bajo demanda, la primera vez que hacen
       falta -- ver cargarScriptExterno() más abajo. -->

  <!-- Logo: se precarga para que el splash de abajo lo muestre al instante -->
  <link rel="preload" as="image" href="/logo-horizontal-sobre-morado.svg" type="image/svg+xml">

  <style>
    html {
      background: #fff;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f5f5f4;
    }
    ::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 4px;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* El navegador pinta los campos autocompletados (usuario/contraseña
       guardados) con un fondo celeste propio que no se puede tapar con
       background-color normal -- solo con este truco del box-shadow
       "inset" gigante, del mismo color que el fondo real del input. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #1c1917;
      -webkit-box-shadow: 0 0 0px 1000px #fff inset;
      box-shadow: 0 0 0px 1000px #fff inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    /* Entrada suave de la pantalla de login/panel de marca. */
    @keyframes auth-panel-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Oculta las flechitas de subir/bajar de los inputs numéricos: le
       restan ancho útil al campo (recortando placeholders como "Contado")
       y no aportan nada en campos de precio/cantidad que se escriben
       directo o tienen sus propios botones +/-. */
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Entrada suave del tooltip del riel de íconos del menú lateral. */
    @keyframes tooltip-rail-in {
      from { opacity: 0; transform: translateY(-50%) translateX(-4px); }
      to { opacity: 1; transform: translateY(-50%) translateX(0); }
    }

    /* Formato de ticket angosto (impresora térmica 80mm) al imprimir.
       Se oculta todo menos el recibo marcado con #recibo-imprimible. */
    @media print {
      body * { visibility: hidden; }
      #recibo-imprimible, #recibo-imprimible * { visibility: visible; }
      #recibo-imprimible {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 4px !important;
        overflow: visible !important;
        clip: auto !important;
        clip-path: none !important;
        white-space: normal !important;
        color: #000;
        background: #fff;
        font-family: 'Courier New', monospace;
      }
      @page { size: 80mm auto; margin: 2mm; }
    }

    /* Splash screen: puro HTML/CSS, visible desde el primer instante (antes
       de que React y Supabase terminen de descargarse), para que nunca se vea
       una pantalla en blanco mientras carga. Fondo violeta de la marca con una
       aurora de manchas de color que se deforman y se mezclan, logo blanco al
       centro. Las medidas usan vw/vh/vmax porque el splash ocupa toda la pantalla. */
    #splash-kaserita {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(120% 90% at 50% 0%, #5a06cf 0%, #43059f 45%, #2c0369 100%);
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
    }
    #splash-kaserita.splash-oculto {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }
    /* Aurora: manchas con degradado radial (ya son suaves, sin filtro de
       desenfoque) que solo se mueven con transform. Así el navegador las
       anima en la tarjeta gráfica y siguen fluidas aunque el hilo principal
       esté ocupado descargando y ejecutando la app. Nada de filter, blend
       modes ni border-radius animados: esos obligan a repintar cada cuadro. */
    #splash-kaserita .au {
      position: absolute;
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }
    #splash-kaserita .au-1 { width: 80vmax; height: 66vmax; left: -22vmax; top: -18vmax; background: radial-gradient(closest-side, rgba(155,77,255,0.95), rgba(155,77,255,0.35) 55%, rgba(155,77,255,0)); animation: au-m1 11s ease-in-out infinite; }
    #splash-kaserita .au-2 { width: 72vmax; height: 60vmax; right: -20vmax; top: 4vmax; background: radial-gradient(closest-side, rgba(215,168,255,0.8), rgba(215,168,255,0.3) 55%, rgba(215,168,255,0)); animation: au-m2 13s ease-in-out infinite; }
    #splash-kaserita .au-3 { width: 76vmax; height: 56vmax; left: -10vmax; bottom: -24vmax; background: radial-gradient(closest-side, rgba(255,95,176,0.75), rgba(255,95,176,0.28) 55%, rgba(255,95,176,0)); animation: au-m3 12s ease-in-out infinite; }
    #splash-kaserita .au-4 { width: 54vmax; height: 44vmax; right: -12vmax; bottom: -18vmax; background: radial-gradient(closest-side, rgba(255,200,26,0.7), rgba(255,200,26,0.25) 55%, rgba(255,200,26,0)); animation: au-m4 10s ease-in-out infinite; }
    #splash-kaserita .au-5 { width: 58vmax; height: 46vmax; left: 30%; top: 20%; background: radial-gradient(closest-side, rgba(106,123,255,0.6), rgba(106,123,255,0.22) 55%, rgba(106,123,255,0)); animation: au-m5 14s ease-in-out infinite; }
    #splash-kaserita .au-velo {
      width: 150vmax; height: 150vmax; left: 50%; top: 55%; margin: -75vmax 0 0 -75vmax;
      opacity: 0.5;
      background: conic-gradient(from 0deg, rgba(0,0,0,0) 0%, rgba(205,160,255,0.7) 14%, rgba(0,0,0,0) 34%, rgba(255,200,26,0.5) 52%, rgba(0,0,0,0) 70%, rgba(255,110,190,0.55) 86%, rgba(0,0,0,0) 100%);
      animation: au-giro 26s linear infinite;
    }
    @keyframes au-giro { to { transform: rotate(360deg); } }
    @keyframes au-m1 { 0%,100% { transform: translate3d(0,0,0) scale(1,1); } 33% { transform: translate3d(34vw,22vh,0) scale(1.25,0.9); } 66% { transform: translate3d(12vw,40vh,0) scale(0.9,1.2); } }
    @keyframes au-m2 { 0%,100% { transform: translate3d(0,0,0) scale(1,1); } 35% { transform: translate3d(-38vw,24vh,0) scale(0.9,1.25); } 70% { transform: translate3d(-14vw,-6vh,0) scale(1.2,0.9); } }
    @keyframes au-m3 { 0%,100% { transform: translate3d(0,0,0) scale(1,1); } 40% { transform: translate3d(40vw,-30vh,0) scale(1.2,0.88); } 75% { transform: translate3d(18vw,-8vh,0) scale(0.92,1.15); } }
    @keyframes au-m4 { 0%,100% { transform: translate3d(0,0,0) scale(1,1); } 50% { transform: translate3d(-42vw,-34vh,0) scale(1.3,0.9); } }
    @keyframes au-m5 { 0%,100% { transform: translate3d(0,0,0) scale(1,1); } 25% { transform: translate3d(26vw,-12vh,0) scale(1.15,0.9); } 50% { transform: translate3d(-8vw,26vh,0) scale(0.9,1.15); } 75% { transform: translate3d(-30vw,-6vh,0) scale(1.1,1); } }

    #splash-kaserita .splash-cont {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 6vw;
    }
    #splash-kaserita .splash-logo-img {
      display: block;
      width: min(62vw, 420px);
      height: auto;
      animation: splash-ent 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes splash-ent { from { opacity: 0; transform: translateY(14px) scale(0.96); } }
    #splash-kaserita .lema-kaserita {
      margin: 1.6rem 0 0;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 14px rgba(40, 0, 110, 0.65);
      animation: splash-ent 1s 0.15s both;
    }
    /* Indicador de carga: barra indeterminada + frase que va cambiando. */
    #splash-kaserita .splash-loading {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: clamp(2rem, 8vh, 4rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: splash-ent 1s 0.3s both;
    }
    #splash-kaserita .splash-progress {
      width: min(46vw, 200px);
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
      position: relative;
    }
    #splash-kaserita .splash-progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 38%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      will-change: transform;
      animation: splash-progress-slide 1.5s ease-in-out infinite;
    }
    @keyframes splash-progress-slide {
      0% { transform: translateX(-105%); }
      100% { transform: translateX(265%); }
    }
    #splash-kaserita .splash-status {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 1px 12px rgba(40, 0, 110, 0.7);
      min-height: 1.2em;
      transition: opacity 0.3s ease;
    }
    #splash-kaserita .splash-status.splash-status-oculto {
      opacity: 0;
    }
    /* Si el sistema pide menos movimiento, todo se queda quieto. */
    @media (prefers-reduced-motion: reduce) {
      #splash-kaserita .au, #splash-kaserita .splash-logo-img { animation: none; }
      #splash-kaserita .splash-progress::after { animation: none; left: 0; width: 100%; }
    }

    /* Panel de marca del login: fondo con 2 manchas de color que se
       desplazan solas (mismo truco que un "mesh gradient" animado --
       animar la posición de cada radial-gradient vía @property, que
       permite interpolar porcentajes en vez de saltar de golpe). */
    @property --kg-blob1-x { syntax: '<percentage>'; inherits: false; initial-value: 88%; }
    @property --kg-blob1-y { syntax: '<percentage>'; inherits: false; initial-value: 86%; }
    @property --kg-blob2-x { syntax: '<percentage>'; inherits: false; initial-value: 12%; }
    @property --kg-blob2-y { syntax: '<percentage>'; inherits: false; initial-value: 82%; }
    .login-brand-mesh {
      --kg-blob1-x: 88%;
      --kg-blob1-y: 86%;
      --kg-blob2-x: 12%;
      --kg-blob2-y: 82%;
      /* Varias paradas del mismo color (en vez de solo "color 0%,
         transparent 65%") para que se apague de a poco -- con solo 2
         paradas, el degradado hacia transparente pasa por un gris turbio a
         mitad de camino y se ve como un círculo con borde marcado en vez
         de un aura difuminada. */
      background:
        radial-gradient(85% 85% at var(--kg-blob1-x) var(--kg-blob1-y), rgba(59,92,246,0.16) 0%, rgba(59,92,246,0.08) 28%, rgba(59,92,246,0.03) 52%, transparent 75%),
        radial-gradient(85% 85% at var(--kg-blob2-x) var(--kg-blob2-y), rgba(139,61,240,0.16) 0%, rgba(139,61,240,0.08) 28%, rgba(139,61,240,0.03) 52%, transparent 75%),
        #ffffff;
      /* Cada mancha tiene su propia animación con distinta duración (15s y
         21s, sin múltiplo común corto) -- así nunca suben y bajan a la vez
         como un solo bloque; se cruzan en momentos distintos cada vuelta y
         el movimiento se ve orgánico en vez de mecánico. */
      animation: login-mesh-drift-1 15s ease-in-out infinite, login-mesh-drift-2 21s ease-in-out infinite;
    }
    /* La mancha azul se mueve solo por la mitad derecha y la violeta solo
       por la mitad izquierda -- si cruzaran el centro al mismo tiempo se
       funden un instante en una sola bola grande y plana (justo lo que no
       se veía bien). Cada una recorre un pequeño lazo (4 puntos) en vez de
       solo subir y bajar en línea recta. */
    @keyframes login-mesh-drift-1 {
      0%   { --kg-blob1-x: 88%; --kg-blob1-y: 84%; }
      25%  { --kg-blob1-x: 68%; --kg-blob1-y: 58%; }
      50%  { --kg-blob1-x: 82%; --kg-blob1-y: 20%; }
      75%  { --kg-blob1-x: 65%; --kg-blob1-y: 46%; }
      100% { --kg-blob1-x: 88%; --kg-blob1-y: 84%; }
    }
    @keyframes login-mesh-drift-2 {
      0%   { --kg-blob2-x: 12%; --kg-blob2-y: 80%; }
      25%  { --kg-blob2-x: 30%; --kg-blob2-y: 50%; }
      50%  { --kg-blob2-x: 16%; --kg-blob2-y: 18%; }
      75%  { --kg-blob2-x: 28%; --kg-blob2-y: 60%; }
      100% { --kg-blob2-x: 12%; --kg-blob2-y: 80%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .login-brand-mesh { animation: none; }
    }
    /* Eslogan bajo el logo (carga e inicio de sesion). Una sola regla para los dos, así miden exactamente lo mismo. */
    .lema-kaserita { margin: -0.75rem 0 0; text-align: center; font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.005em; color: #4d04b0; }
    .lema-kaserita b { font-weight: 800; color: #1c1830; background: #FFC81A; border-radius: 6px; padding: 1px 7px; }
    @media (min-width: 768px) { .lema-kaserita { font-size: 1.0625rem; } }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 h-screen overflow-hidden font-sans">
  <div id="splash-kaserita">
    <div class="au au-velo"></div>
    <div class="au au-b au-1"></div>
    <div class="au au-b au-2"></div>
    <div class="au au-b au-3"></div>
    <div class="au au-b au-4"></div>
    <div class="au au-b au-5"></div>
    <div class="splash-cont">
      <img class="splash-logo-img" src="/logo-horizontal-sobre-morado.svg" width="2068" height="642" alt="Kaserita - Punto de Venta">
      <p class="lema-kaserita">Tu negocio <b>bajo</b> control</p>
    </div>
    <div class="splash-loading">
      <div class="splash-progress"></div>
      <p class="splash-status" id="splash-status">Preparando tu catálogo...</p>
    </div>
  </div>
  <div id="root"></div>

  <script src="/splash-pos.js"></script>
  <script src="/estilos-diferidos.js"></script>

  <script src="/sw-registro.js"></script>

  <!-- Aplicación React + Supabase con Todos los Módulos -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
