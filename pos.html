<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaserita - Punto de Venta</title>
  <!-- Primero de todo: repara archivos de /assets/ que se quedaron en caché como 404 (ver public/auto-reparar.js) -->
  <script src="/auto-reparar.js"></script>

  <!-- PWA: instalable como app en el celular ("Agregar a pantalla de inicio") -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f3fd">
  <!-- Sin esto, Chrome en Android con modo oscuro del sistema "fuerza"
       su propio oscurecimiento sobre fondos sin color explícito -- se ve
       como franjas negras en las esquinas redondeadas del login. -->
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaserita">

  <link rel="stylesheet" href="/src/index.css">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- media="print" + /estilos-diferidos.js: la hoja se baja sin bloquear el primer dibujo de la pantalla -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" data-diferido>

  <!-- Íconos de línea (Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" data-diferido>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </noscript>

  <!-- React, Supabase y el bundle de la app: compilados por Vite (ver src/main.jsx) -->

  <!-- Canvas Confetti, jsPDF, zxing-wasm y XLSX (SheetJS) NO se cargan acá.
       Son pesadas y cada bodega usa una sola de ellas de vez en cuando (una
       imprime boletas por Bluetooth, otra nunca exporta a Excel, etc.) --
       cargarlas siempre de entrada demoraba el arranque en celulares de gama
       baja para funciones que la mayoría de las veces no se van a tocar en
       esa sesión. Se cargan solas, bajo demanda, la primera vez que hacen
       falta -- ver cargarScriptExterno() más abajo. -->

  <!-- Logo: se precarga para que el splash de abajo lo muestre al instante -->
  <link rel="preload" as="image" href="/logo-horizontal-sobre-morado.svg" type="image/svg+xml">

  <style>
    html {
      background: #fff;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f5f5f4;
    }
    ::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 4px;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* El navegador pinta los campos autocompletados (usuario/contraseña
       guardados) con un fondo celeste propio que no se puede tapar con
       background-color normal -- solo con este truco del box-shadow
       "inset" gigante, del mismo color que el fondo real del input. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #1c1917;
      -webkit-box-shadow: 0 0 0px 1000px #fff inset;
      box-shadow: 0 0 0px 1000px #fff inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    /* Entrada suave de la pantalla de login/panel de marca. */
    @keyframes auth-panel-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Oculta las flechitas de subir/bajar de los inputs numéricos: le
       restan ancho útil al campo (recortando placeholders como "Contado")
       y no aportan nada en campos de precio/cantidad que se escriben
       directo o tienen sus propios botones +/-. */
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Entrada suave del tooltip del riel de íconos del menú lateral. */
    @keyframes tooltip-rail-in {
      from { opacity: 0; transform: translateY(-50%) translateX(-4px); }
      to { opacity: 1; transform: translateY(-50%) translateX(0); }
    }

    /* Formato de ticket angosto (impresora térmica 80mm) al imprimir.
       Se oculta todo menos el recibo marcado con #recibo-imprimible. */
    @media print {
      body * { visibility: hidden; }
      #recibo-imprimible, #recibo-imprimible * { visibility: visible; }
      #recibo-imprimible {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 4px !important;
        overflow: visible !important;
        clip: auto !important;
        clip-path: none !important;
        white-space: normal !important;
        color: #000;
        background: #fff;
        font-family: 'Courier New', monospace;
      }
      @page { size: 80mm auto; margin: 2mm; }
    }

    /* Splash screen: puro HTML/CSS, visible desde el primer instante (antes
       de que React y Supabase terminen de descargarse), para que nunca se vea
       una pantalla en blanco mientras carga. Simple a propósito: degradado
       violeta de la marca con un leve resplandor detrás del logo (blanco con
       acento amarillo) y tres puntos que pulsan. Sin manchas animadas ni frases. */
    #splash-kaserita {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(70% 45% at 50% 42%, rgba(160, 110, 255, 0.5) 0%, rgba(160, 110, 255, 0) 70%),
        linear-gradient(165deg, #6c22ee 0%, #4a0cb8 100%);
      contain: strict;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    }
    #splash-kaserita.splash-oculto {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }
    #splash-kaserita .splash-cont {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 6vw;
    }
    #splash-kaserita .splash-logo-img {
      display: block;
      width: min(62vw, 420px);
      height: auto;
      animation: splash-ent 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes splash-ent { from { opacity: 0; transform: translateY(14px) scale(0.96); } }
    /* Tres puntos que pulsan: solo opacity y transform (los anima la tarjeta
       gráfica, siguen fluidos aunque el hilo principal esté ocupado). */
    #splash-kaserita .splash-puntos {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: clamp(2.5rem, 9vh, 4.5rem);
      display: flex;
      justify-content: center;
      gap: 8px;
      animation: splash-ent 0.6s 0.15s both;
    }
    #splash-kaserita .splash-puntos i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.35;
      will-change: transform, opacity;
      animation: splash-punto 1.2s ease-in-out infinite;
    }
    #splash-kaserita .splash-puntos i:nth-child(2) { animation-delay: 0.15s; }
    #splash-kaserita .splash-puntos i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-punto { 40% { opacity: 1; transform: translateY(-3px); } }
    /* Con la pestaña oculta no hace falta animar nada. */
    #splash-kaserita.splash-pausado .splash-puntos i { animation-play-state: paused; }
    /* Si el sistema pide menos movimiento, todo se queda quieto. */
    @media (prefers-reduced-motion: reduce) {
      #splash-kaserita .splash-logo-img, #splash-kaserita .splash-puntos, #splash-kaserita .splash-puntos i { animation: none; }
      #splash-kaserita .splash-puntos i { opacity: 0.7; }
    }

    /* Panel de marca del login: el mismo degradado violeta del splash, para que
       al retirarse el splash la pantalla de ingreso siga sin saltos de color.
       Quieto a propósito (sin manchas animadas). */
    .login-brand-mesh {
      background:
        radial-gradient(70% 45% at 50% 42%, rgba(160, 110, 255, 0.5) 0%, rgba(160, 110, 255, 0) 70%),
        linear-gradient(165deg, #6c22ee 0%, #4a0cb8 100%);
    }
    /* Eslogan bajo el logo (carga e inicio de sesion). Una sola regla para los dos, así miden exactamente lo mismo. */
    .lema-kaserita { margin: -0.75rem 0 0; text-align: center; font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.005em; color: #4d04b0; }
    .lema-kaserita b { font-weight: 800; color: #1c1830; background: #FFC81A; border-radius: 6px; padding: 1px 7px; }
    /* Sobre el panel violeta del login el lema va en blanco (el "bajo" sigue en amarillo). */
    .login-brand-mesh .lema-kaserita { margin: 0; color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 12px rgba(40, 0, 110, 0.35); }
    @media (min-width: 768px) { .lema-kaserita { font-size: 1.0625rem; } }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 h-screen overflow-hidden font-sans">
  <div id="splash-kaserita">
    <div class="splash-cont">
      <img class="splash-logo-img" src="/logo-horizontal-sobre-morado.svg" width="2068" height="642" alt="Kaserita - Punto de Venta">
    </div>
    <div class="splash-puntos" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="root"></div>

  <script src="/splash-pos.js?v=3"></script>
  <script src="/estilos-diferidos.js"></script>

  <script src="/sw-registro.js"></script>

  <!-- Aplicación React + Supabase con Todos los Módulos -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
