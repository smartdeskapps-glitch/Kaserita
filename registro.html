<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kaserita - Activa tu negocio</title>
<meta name="description" content="Punto de Venta + Catálogo Online para tu negocio. Elige tu plan, escríbenos por WhatsApp y activa tu cuenta." />
<link rel="icon" href="/icon-192.png" type="image/png">
<meta property="og:title" content="Kaserita - Activa tu negocio">
<meta property="og:description" content="Elige tu plan, escríbenos por WhatsApp y activa tu cuenta.">
<meta property="og:image" content="https://kaserita.smartdeskapps.com/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- React, Supabase y el bundle: compilados por Vite (ver src/registro.jsx) -->
<style>
  :root {
    --paper: #faf8f6;
    --card: #ffffff;
    --ink: #1c1523;
    --muted: #6f6779;
    --line: #e9e3ee;
    --violet: #7c3aed;
    --violet-ink: #5b21b6;
    --blue: #2563eb;
    --soft: #f4eefe;
    --soft2: #ece0fd;
    --wa: #1fa855;
    --wa-ink: #0f7a3a;
    --emerald: #059669;
    --emerald-bg: #ecfdf5;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  h1, h2, h3, p, ul { margin: 0; }
  button { font-family: inherit; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .wa { width: 1.25em; height: 1.25em; fill: currentColor; flex-shrink: 0; }
  :focus-visible { outline: 3px solid rgba(124,58,237,.4); outline-offset: 2px; }

  /* ---------- Cabecera (hero) ---------- */
  .hero {
    background: linear-gradient(160deg, #4d04b0 0%, #6d28d9 55%, #2563eb 130%);
    color: #fff; border-radius: 0 0 30px 30px;
  }
  .hero-in { max-width: 1080px; margin: 0 auto; padding: 18px 18px 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-logo { height: 50px; width: auto; display: block; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand-name span { color: #d8c4ff; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 6px 11px;
  }
  .session-note { font-size: 12px; color: rgba(255,255,255,.85); margin: -6px 0 12px; }
  .session-note button {
    background: none; border: none; padding: 0; font: inherit; color: #fff;
    font-weight: 600; cursor: pointer; text-decoration: underline;
  }

  .hero-grid { display: grid; grid-template-columns: 1fr; }
  .hero-copy h1 {
    font-family: var(--font-display); font-weight: 800; letter-spacing: -0.015em;
    font-size: 23px; line-height: 1.15; text-wrap: balance;
  }
  .eyebrow-w, .hero-sub, .trust-row { display: none; }
  .hero-woman { display: none; }

  .panel { margin-top: 0; }
  .seg { display: grid; gap: 4px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px; margin-top: 16px; }
  .seg button {
    border: none; background: none; cursor: pointer; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 10px 6px;
    border-radius: 999px; color: rgba(255,255,255,.88); transition: background .15s ease, color .15s ease;
  }
  .seg button.on { background: #fff; color: var(--violet-ink); }
  .seg button:focus-visible { outline-color: #fff; }
  .bigprice {
    font-family: var(--font-display); font-weight: 800; font-size: 54px; letter-spacing: -0.03em;
    line-height: 1; margin-top: 20px;
  }
  .bigprice small { font-size: 16px; font-weight: 600; opacity: .8; letter-spacing: 0; }
  .heroline { font-size: 13.5px; opacity: .92; margin-top: 8px; line-height: 1.45; }
  .checks { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .checks li { display: flex; gap: 7px; align-items: flex-start; font-size: 12.8px; line-height: 1.35; }
  .checks .ic { width: 15px; height: 15px; stroke-width: 2.2; margin-top: 1px; color: #b7f5cc; }

  /* El botón queda a caballo entre la cabecera y el contenido */
  .cta-row { margin: 22px 0 -26px; }
  .cta {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--wa); color: #fff; border: none; cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
    border-radius: 999px; padding: 15px 18px; box-shadow: 0 10px 22px rgba(31,168,85,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(31,168,85,.4); }
  .cta { text-decoration: none; }
  .cta:disabled, .cta[aria-disabled="true"] { opacity: .55; cursor: default; transform: none; pointer-events: none; }
  .cta:focus-visible { outline-color: #fff; }
  .fine { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.5; }
  .fine-m { margin-top: 42px; }
  .fine-m + .fine-m { margin-top: 6px; }
  .fine a { color: var(--violet-ink); font-weight: 600; text-decoration: none; }
  .fine a:hover { text-decoration: underline; }
  .fine-d.fine-alt { margin-top: 6px; }
  .fine-d.fine-alt a { color: #fff; text-decoration: underline; }
  .field { display: block; margin-top: 18px; }
  .field span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; opacity: .95; }
  .field em { font-style: normal; font-weight: 500; opacity: .75; }
  .field input {
    width: 100%; font: 500 14.5px var(--font-body); color: var(--ink); background: #fff;
    border: 1.5px solid transparent; border-radius: 14px; padding: 13px 14px;
  }
  .field input::placeholder { color: #9b94a6; }
  .field input:focus { outline: none; border-color: #c4b5fd; box-shadow: 0 0 0 3px rgba(196,181,253,.45); }
  .fine-d { display: none; }

  .panel-carga { text-align: center; padding: 34px 0 40px; font-size: 13.5px; opacity: .9; }
  .panel-carga .spinner { border-color: rgba(255,255,255,.3); border-top-color: #fff; }

  /* ---------- Contenido ---------- */
  .main { max-width: 1080px; margin: 0 auto; padding: 0 18px 48px; }
  .sec { margin-top: 34px; }
  .sec-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sec-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .sec-title + .minis { margin-top: 12px; }

  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mini { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 9px; text-align: center; }
  .dot { width: 34px; height: 34px; margin: 0 auto 8px; border-radius: 50%; background: var(--soft); color: var(--violet-ink); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .mini b { display: block; font-family: var(--font-display); font-size: 13px; }
  .mini span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  .benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .benefit { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
  .benefit-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(124,58,237,.1); color: var(--violet); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 17px; }
  .benefit h3 { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
  .benefit p { font-size: 12px; color: var(--muted); line-height: 1.45; }

  .faq { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
  .faq-item { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  .faq-q { width: 100%; background: none; border: none; padding: 14px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink); cursor: pointer; }
  .faq-q .ic { width: 15px; height: 15px; color: var(--muted); transition: transform .2s ease; }
  .faq-item.open .faq-q .ic { transform: rotate(180deg); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease; }
  .faq-item.open .faq-a { max-height: 340px; }
  .faq-a p { padding: 0 15px 14px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }


  /* Preguntas frecuentes: bloque discreto, mas chico que el resto de las secciones */
  .sec-faq .sec-title { font-size: 16px; }
  .sec-faq .sec-sub { font-size: 12px; margin-bottom: 12px; }
  .sec-faq .faq { max-width: 600px; gap: 7px; }
  .sec-faq .faq-item { border-radius: 12px; border-width: 1px; }
  .sec-faq .faq-q { font-size: 12.5px; padding: 11px 14px; }
  .sec-faq .faq-q .ic { width: 13px; height: 13px; }
  .sec-faq .faq-a p { font-size: 12px; padding: 0 14px 12px; }

  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.7; }
  footer a { color: var(--violet-ink); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---------- Estado "ya tienes una bodega" ---------- */
  .wrap-min { max-width: 520px; margin: 0 auto; padding: 24px 18px 48px; }
  .topbar-light .brand-mark { background: linear-gradient(135deg, var(--blue), var(--violet)); }
  .topbar-light .brand-name { color: var(--ink); }
  .topbar-light .brand-name span { color: var(--violet); }
  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px; }
  .card h2 { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin-bottom: 6px; letter-spacing: -0.01em; }
  .screen-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .center-block { text-align: center; padding: 22px 6px; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--violet); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-badge { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%; background: var(--emerald-bg); color: var(--emerald); display: flex; align-items: center; justify-content: center; }
  .success-badge svg { width: 24px; height: 24px; }
  .pay-btn {
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    background: linear-gradient(120deg, var(--blue), var(--violet)); color: #fff;
    font-family: var(--font-display); font-weight: 700; font-size: 14.5px; border-radius: 13px; padding: 14px;
    box-shadow: 0 10px 24px -10px rgba(124,58,237,.5);
  }

  /* ---------- Escritorio ---------- */
  @media (min-width: 900px) {
    .hero { border-radius: 0 0 48px 48px; padding-bottom: 64px; }
    .hero-in { padding: 26px 32px 0; }
    .topbar { margin-bottom: 8px; }
    .brand-logo { height: 58px; }
    .hero-grid { grid-template-columns: 1.05fr .95fr; gap: 64px; align-items: center; margin-top: 44px; }
    .eyebrow-w {
      display: inline-flex; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 13px; margin-bottom: 18px;
    }
    .hero-copy h1 { font-size: 50px; line-height: 1.05; letter-spacing: -0.025em; }
    .hero-sub { display: block; font-size: 17px; line-height: 1.55; opacity: .92; margin-top: 16px; max-width: 42ch; }
    .trust-row { display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0; margin-top: 26px; }
    .trust-row li { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 500; }
    .trust-row .ic { width: 18px; height: 18px; stroke-width: 2.2; color: #b7f5cc; }
    /* El plan se muestra como una boleta: papel blanco, borde inferior
       dentado y una linea punteada que separa el total del detalle. */
    .panel {
      position: relative; background: #fff; color: var(--ink);
      border-radius: 22px 22px 0 0; padding: 28px 30px 30px;
      box-shadow: 0 34px 60px -28px rgba(20,4,60,.65);
    }
    .panel::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px;
      background: linear-gradient(135deg, #fff 50%, transparent 50%) 0 0 / 14px 14px,
                  linear-gradient(225deg, #fff 50%, transparent 50%) 0 0 / 14px 14px;
    }
    .panel .seg { background: var(--soft); }
    .panel .seg button { color: var(--muted); }
    .panel .seg button.on { background: var(--violet); color: #fff; box-shadow: 0 6px 14px -8px rgba(124,58,237,.8); }
    .panel .bigprice { color: var(--ink); }
    .panel .bigprice small { color: var(--muted); opacity: 1; }
    .panel .heroline { color: var(--muted); opacity: 1; }
    .panel .checks { margin-top: 22px; padding-top: 20px; border-top: 2px dashed var(--line); }
    .panel .checks .ic { color: var(--emerald); }
    .panel .field span { color: var(--ink); opacity: 1; }
    .panel .field em { color: var(--muted); opacity: 1; }
    .panel .field input { background: var(--paper); border-color: var(--line); }
    .panel .field input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,58,237,.18); }
    .panel .panel-carga { color: var(--muted); }
    .panel .panel-carga .spinner { border-color: var(--line); border-top-color: var(--violet); }
    .fine-d.fine-alt a { color: var(--violet-ink); }
    .seg { margin-top: 0; }
    .seg button { font-size: 14.5px; padding: 12px 8px; }
    .bigprice { font-size: 68px; margin-top: 26px; }
    .bigprice small { font-size: 19px; }
    .heroline { font-size: 15px; }
    .checks { margin-top: 20px; gap: 10px 16px; }
    .checks li { font-size: 14px; }
    .cta-row { margin: 26px 0 0; }
    .cta { font-size: 16.5px; padding: 17px 20px; }
    .fine-m { display: none; }
    .fine-d { display: block; margin-top: 12px; }
    .main { padding: 0 32px 64px; }
    .sec { margin-top: 56px; }
    .sec-title { font-size: 24px; }
    .sec-sub { font-size: 14.5px; }
    .minis { gap: 18px; }
    .mini { padding: 24px 20px; border-radius: 22px; }
    .dot { width: 46px; height: 46px; font-size: 20px; margin-bottom: 12px; }
    .mini b { font-size: 16px; }
    .mini span { font-size: 13.5px; margin-top: 5px; }
    .benefits { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .benefit { padding: 22px; border-radius: 20px; }
    .benefit h3 { font-size: 15px; }
    .benefit p { font-size: 13px; }
    .sec-faq .sec-title { font-size: 18px; }
    .sec-faq .faq-q { font-size: 13px; padding: 12px 16px; }
    .sec-faq .faq-a p { font-size: 12.5px; padding: 0 16px 13px; }
        }
  /* Pantallas anchas: la emprendedora de Kaserita entre el texto y el plan,
     parada sobre el borde de la cabecera y delante de un arco claro. */
  @media (min-width: 1200px) {
    .hero-in { max-width: 1240px; }
    .hero-grid { grid-template-columns: minmax(0, 1fr) 250px 440px; gap: 28px; }
    .hero-woman { display: block; position: relative; align-self: end; margin-bottom: -64px; width: 250px; height: 480px; }
    .hero-woman::before {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80%;
      border-radius: 999px 999px 0 0; background: linear-gradient(180deg, #efe6ff 0%, #cdb6fb 100%);
    }
    .hero-woman img { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; transform: translateX(-50%); display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module" src="/src/registro.jsx"></script>
</body>
</html>
