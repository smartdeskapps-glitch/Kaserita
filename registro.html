<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kaserita - Activá tu bodega</title>
<meta name="description" content="Punto de Venta + Catálogo Online para tu bodega. Activá tu cuenta en minutos." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- React, Supabase y el bundle: compilados por Vite (ver src/registro.jsx) -->
<style>
  :root {
    --paper: #faf8f6;
    --card: #ffffff;
    --ink: #1c1523;
    --muted: #6f6779;
    --line: #e9e3ee;
    --violet: #7c3aed;
    --violet-ink: #5b21b6;
    --blue: #2563eb;
    --emerald: #059669;
    --emerald-bg: #ecfdf5;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 56px; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .ic-fill { fill: currentColor; stroke: none; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(124,58,237,.45);
  }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand-name { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand-name span { color: var(--violet); }
  .topbar-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .topbar-note i { color: var(--emerald); }

  .session-note {
    display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    font-size: 12px; color: var(--muted); margin: -10px 0 18px;
  }
  .session-note button {
    background: none; border: none; padding: 0; font: inherit; color: var(--violet-ink);
    font-weight: 600; cursor: pointer; text-decoration: underline;
  }

  .hero { margin-bottom: 26px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--violet-ink); background: rgba(124,58,237,.1);
    border: 1px solid rgba(124,58,237,.22);
    padding: 5px 11px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em;
    font-size: clamp(26px, 6vw, 32px); line-height: 1.1; margin: 0 0 10px;
  }
  h1 em { font-style: normal; color: var(--violet); }
  .hero-sub { font-size: 14.5px; color: var(--muted); line-height: 1.55; margin: 0 0 16px; max-width: 42ch; }
  .trust-row { display: flex; flex-wrap: wrap; gap: 14px; }
  .trust-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); font-weight: 500; }
  .trust-item i { color: var(--emerald); }

  .stepper { display: flex; align-items: center; gap: 6px; margin-bottom: 24px; }
  .step { display: flex; align-items: center; gap: 8px; flex: 1; }
  .step-dot {
    width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: var(--font-display); font-weight: 700; font-size: 11.5px; color: var(--muted);
    background: var(--card); transition: all .2s ease;
  }
  .step-label { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .step-line { flex: 1; height: 1.5px; background: var(--line); margin: 0 2px; transition: background .2s ease; }
  .step.done .step-dot { background: var(--emerald); border-color: var(--emerald); color: #fff; }
  .step.active .step-dot { background: var(--violet); border-color: var(--violet); color: #fff; }
  .step.active .step-label, .step.done .step-label { color: var(--ink); }
  .step-line.filled { background: var(--emerald); }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px; }
  .screen { animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  h2 { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .screen-sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }

  .plans { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .plan {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 15px;
    padding: 15px 16px; cursor: pointer; text-align: left; width: 100%; font-family: var(--font-body); color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    display: flex; align-items: center; gap: 13px;
  }
  .plan.selected { border-color: var(--violet); background: var(--card); box-shadow: 0 0 0 3px rgba(124,58,237,.14); }
  .plan-check {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; font-size: 10px;
  }
  .plan.selected .plan-check { background: var(--violet); border-color: var(--violet); color: #fff; }
  .plan-body { flex: 1; min-width: 0; }
  .plan-top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .plan-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .plan-price { font-family: var(--font-display); font-weight: 800; font-size: 16px; }
  .plan-price small { font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); }
  .plan-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .plan-promo { font-size: 10.5px; color: var(--violet-ink); font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .plan-badge {
    font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px;
    background: linear-gradient(120deg, var(--blue), var(--violet)); color: #fff;
  }

  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 13px; padding: 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); cursor: pointer;
    transition: border-color .15s ease, transform .12s ease;
  }
  .google-btn:hover { border-color: rgba(124,58,237,.4); transform: translateY(-1px); }
  .google-btn:disabled { opacity: .5; cursor: default; transform: none; }
  .google-btn svg { width: 18px; height: 18px; }
  .fine-print { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }

  .center-block { text-align: center; padding: 26px 6px; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--violet); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-badge { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%; background: var(--emerald-bg); color: var(--emerald); display: flex; align-items: center; justify-content: center; }
  .success-badge svg { width: 24px; height: 24px; }

  .account-chip { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 13px; padding: 11px 13px; margin-bottom: 18px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .account-chip-text strong { font-size: 13px; display: block; }
  .account-chip-text span { font-size: 11px; color: var(--muted); word-break: break-all; }

  .pay-summary { background: var(--paper); border: 1.5px solid var(--line); border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .pay-summary-left strong { font-family: var(--font-display); font-size: 13.5px; display: block; margin-bottom: 2px; }
  .pay-summary-left span { font-size: 11px; color: var(--muted); }
  .pay-summary-price { font-family: var(--font-display); font-weight: 800; font-size: 18px; white-space: nowrap; }

  .pay-btn {
    width: 100%; background: linear-gradient(120deg, var(--blue), var(--violet)); color: #fff;
    font-family: var(--font-display); font-weight: 700; font-size: 14.5px; border: none; border-radius: 13px; padding: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    box-shadow: 0 10px 24px -10px rgba(124,58,237,.5); transition: transform .12s ease;
  }
  .pay-btn:hover { transform: translateY(-1px); }
  .pay-btn:disabled { opacity: .5; cursor: default; transform: none; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink); }
  .field .hint { font-size: 10.5px; color: var(--muted); }
  .field input {
    font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--line); border-radius: 11px; padding: 10.5px 13px; outline: none; transition: border-color .15s ease; width: 100%;
  }
  .field input:focus { border-color: var(--violet); }
  .input-prefix { position: relative; }
  .input-prefix span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--muted); }
  .input-prefix input { padding-left: 30px; }

  .error-box { font-size: 12px; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }

  .section { margin: 38px 0; }
  .section-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .section-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }

  .benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .benefit { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
  .benefit-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(124,58,237,.1); color: var(--violet); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .benefit-icon svg { width: 17px; height: 17px; }
  .benefit h3 { font-family: var(--font-display); font-weight: 700; font-size: 13px; margin: 0 0 4px; }
  .benefit p { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.45; }

  .how-steps { display: flex; flex-direction: column; gap: 16px; }
  .how-step { display: flex; gap: 14px; align-items: flex-start; }
  .how-num { width: 29px; height: 29px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 12.5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .how-text strong { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; display: block; margin-bottom: 2px; }
  .how-text span { font-size: 12px; color: var(--muted); line-height: 1.45; }

  .faq { display: flex; flex-direction: column; gap: 10px; }
  .faq-item { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  .faq-q { width: 100%; background: none; border: none; padding: 14px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .faq-q svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; transition: transform .2s ease; }
  .faq-item.open .faq-q svg { transform: rotate(180deg); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease; }
  .faq-item.open .faq-a { max-height: 220px; }
  .faq-a p { margin: 0; padding: 0 15px 14px; font-size: 12px; color: var(--muted); line-height: 1.55; }

  .cta-banner { background: linear-gradient(135deg, var(--violet), var(--blue)); border-radius: 20px; padding: 26px 22px; text-align: center; color: #fff; }
  .cta-banner h3 { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0 0 6px; }
  .cta-banner p { font-size: 12.5px; margin: 0 0 16px; opacity: .9; }
  .cta-banner .google-btn { background: #fff; }
  .cta-banner .google-btn:disabled { opacity: .6; }

  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); text-align: center; }
  footer a { color: var(--violet-ink); text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module" src="/src/registro.jsx"></script>
</body>
</html>
