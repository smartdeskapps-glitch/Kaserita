<body class="bg-stone-950 text-stone-100 h-screen overflow-hidden font-sans">
  <div id="root"></div>

  <!-- Aplicación React + Supabase con Todos los Módulos -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const generarUUID = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    };

    const PRODUCTOS_SEMILLA = [
      { cod_ean: '775012300001', descripcion: 'Leche Gloria Entera 400g (Azul)', precio_costo: 3.50, precio_venta: 4.20, categoria: 'Lácteos', unidad: 'UND' },
      { cod_ean: '775012300002', descripcion: 'Arroz Extra Costeño 1kg', precio_costo: 4.10, precio_venta: 5.00, categoria: 'Abarrotes', unidad: 'UND' },
      { cod_ean: '775012300003', descripcion: 'Aceite Vegetal Primor Clásico 900ml', precio_costo: 7.80, precio_venta: 9.50, categoria: 'Abarrotes', unidad: 'UND' },
      { cod_ean: '775012300004', descripcion: 'Gaseosa Inca Kola 500ml', precio_costo: 2.20, precio_venta: 3.00, categoria: 'Bebidas', unidad: 'UND' },
      { cod_ean: '775012300005', descripcion: 'Gaseosa Coca Cola 500ml', precio_costo: 2.80, precio_venta: 3.50, categoria: 'Bebidas', unidad: 'UND' },
      { cod_ean: '775012300006', descripcion: 'Galletas Margarita Field Paquete x 6', precio_costo: 2.50, precio_venta: 3.20, categoria: 'Golosinas', unidad: 'UND' },
      { cod_ean: '775012300007', descripcion: 'Pollo Fresco Entero (por KG)', precio_costo: 7.50, precio_venta: 9.80, categoria: 'Carnes', unidad: 'KG' },
      { cod_ean: '775012300008', descripcion: 'Papa Amarilla Seleccionada (por KG)', precio_costo: 2.20, precio_venta: 3.50, categoria: 'Verduras', unidad: 'KG' },
      { cod_ean: '775012300009', descripcion: 'Huevos Pardos Granja (Docena)', precio_costo: 7.00, precio_venta: 8.50, categoria: 'Frescos', unidad: 'UND' },
      { cod_ean: '775012300010', descripcion: 'Detergente Opal Ultra 800g', precio_costo: 6.20, precio_venta: 7.80, categoria: 'Limpieza', unidad: 'UND' }
    ];

    // Teclado numérico en pantalla, reutilizable para efectivo y pagos mixtos.
    function NumericKeypad({ value, onChange }) {
      const teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'];
      const presionar = (t) => {
        if (t === '⌫') { onChange(value.slice(0, -1)); return; }
        if (t === '.' && value.includes('.')) return;
        onChange(value + t);
      };
      return (
        <div className="grid grid-cols-3 gap-1.5 mt-1.5">
          {teclas.map((t) => (
            <button
              key={t}
              type="button"
              onClick={() => presionar(t)}
              className="py-2 bg-stone-900 hover:bg-stone-800 border border-stone-800 rounded-lg text-sm font-bold text-stone-200 active:scale-95 transition"
            >
              {t}
            </button>
          ))}
          <button
            type="button"
            onClick={() => onChange('')}
            className="col-span-3 py-1.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 rounded-lg text-[11px] font-bold text-rose-200"
          >
            Limpiar
          </button>
        </div>
      );
    }

    // Muestra el QR real de Yape/Plin de la bodega (imagen subida una sola vez y
    // guardada en este navegador). No se genera un QR "falso" porque Yape/Plin
    // usan un formato propietario del banco — aquí se reutiliza la imagen
    // física/oficial del negocio.
    function QRPagoModal({ bodegaId, medioPago, monto, onClose }) {
      const storageKey = `qr_pago_${medioPago}_${bodegaId}`;
      const [qrImg, setQrImg] = useState(() => localStorage.getItem(storageKey));
      const inputRef = useRef(null);

      const handleSubirQR = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          localStorage.setItem(storageKey, reader.result);
          setQrImg(reader.result);
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
          <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center space-y-3">
            <h3 className="text-base font-bold text-white">Pago con {medioPago}</h3>
            <p className="text-sm text-stone-300">
              Monto: <span className="font-black text-orange-400 text-lg">S/ {Number(monto).toFixed(2)}</span>
            </p>
            {qrImg ? (
              <div className="bg-white p-3 rounded-xl inline-block">
                <img src={qrImg} alt={`QR ${medioPago}`} className="w-44 h-44 object-contain" />
              </div>
            ) : (
              <div className="bg-stone-950 border border-dashed border-stone-700 rounded-xl p-5 text-xs text-stone-400">
                Aún no has guardado el QR de {medioPago} de tu bodega.
              </div>
            )}
            <input ref={inputRef} type="file" accept="image/*" onChange={handleSubirQR} className="hidden" />
            <button
              type="button"
              onClick={() => inputRef.current?.click()}
              className="w-full py-2 bg-stone-800 hover:bg-stone-700 text-white text-xs font-semibold rounded-lg"
            >
              {qrImg ? 'Cambiar imagen del QR' : `Subir QR de ${medioPago}`}
            </button>
            <button onClick={onClose} className="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl">
              Cerrar
            </button>
          </div>
        </div>
      );
    }

    // Ícono de la barra lateral de navegación (desktop) / barra inferior (mobile).
    function SidebarIcon({ icon, label, badge, tone = 'default', active = false, onClick }) {
      const toneClasses = tone === 'rose'
        ? 'text-rose-400 hover:bg-rose-500/10 hover:text-rose-300'
        : tone === 'orange'
        ? 'text-orange-400 hover:bg-orange-500/10 hover:text-orange-300'
        : active
        ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/25'
        : 'text-stone-500 hover:bg-stone-800 hover:text-stone-200';
      return (
        <button
          type="button"
          onClick={onClick}
          className={`group relative w-11 h-11 flex items-center justify-center rounded-xl transition-all duration-200 ${toneClasses}`}
        >
          <i className={`fa-solid ${icon} text-[15px]`}></i>
          {badge > 0 && (
            <span className="absolute -top-0.5 -right-0.5 bg-orange-500 text-white text-[9px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center ring-2 ring-stone-900">
              {badge}
            </span>
          )}
          {/* Tooltip al pasar el mouse */}
          <span className="pointer-events-none absolute left-full ml-3 px-2.5 py-1.5 bg-stone-800 text-stone-100 text-[11px] font-medium rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity shadow-xl border border-stone-700 z-50">
            {label}
          </span>
        </button>
      );
    }

    // Cada categoría tiene su ícono de línea y un color de acento propio, para que
    // el catálogo se lea de un vistazo sin depender de fotos de producto.
    const CATEGORIA_ESTILO = {
      'Lácteos':   { icono: 'fa-mug-hot',       color: 'text-sky-300',    fondo: 'from-sky-500/20 to-sky-500/5' },
      'Abarrotes': { icono: 'fa-wheat-awn',     color: 'text-amber-300',  fondo: 'from-amber-500/20 to-amber-500/5' },
      'Bebidas':   { icono: 'fa-bottle-water',  color: 'text-cyan-300',   fondo: 'from-cyan-500/20 to-cyan-500/5' },
      'Golosinas': { icono: 'fa-cookie-bite',   color: 'text-pink-300',   fondo: 'from-pink-500/20 to-pink-500/5' },
      'Carnes':    { icono: 'fa-drumstick-bite',color: 'text-rose-300',   fondo: 'from-rose-500/20 to-rose-500/5' },
      'Verduras':  { icono: 'fa-carrot',        color: 'text-lime-300',   fondo: 'from-lime-500/20 to-lime-500/5' },
      'Frescos':   { icono: 'fa-egg',           color: 'text-orange-200', fondo: 'from-orange-400/20 to-orange-400/5' },
      'Limpieza':  { icono: 'fa-pump-soap',     color: 'text-violet-300', fondo: 'from-violet-500/20 to-violet-500/5' }
    };
    const estiloCategoria = (cat) => CATEGORIA_ESTILO[cat] || { icono: 'fa-box', color: 'text-stone-300', fondo: 'from-stone-600/20 to-stone-600/5' };

    function PosApp() {
      // --- Supabase Config ---
      const [supabaseUrl, setSupabaseUrl] = useState(
        localStorage.getItem('pos_sb_url') || 'https://hzmrsbeamtbloudmxjrp.supabase.co'
      );
      const [supabaseKey, setSupabaseKey] = useState(
        localStorage.getItem('pos_sb_key') || 'sb_publishable_RHAkd7pZIadDnSQClFdjMQ_lrG3p-gw'
      );
      const [modalConfig, setModalConfig] = useState(false);

      // --- Sesión (Tabla `usuarios`) ---
      const [sesion, setSesion] = useState(() => {
        const g = localStorage.getItem('pos_user_session');
        return g ? JSON.parse(g) : null;
      });

      // --- Auth Form ---
      const [authTab, setAuthTab] = useState('login');
      const [formLogin, setFormLogin] = useState({ dni: '', pin: '' });
      const [formRegistro, setFormRegistro] = useState({ nombreBodega: '', nombreDueno: '', dni: '', pin: '' });
      const [cargandoAuth, setCargandoAuth] = useState(false);

      // --- Bodega & Cajeros ---
      const bodegaId = sesion?.bodega?.id || sesion?.usuario?.bodega_id;
      const bodegaNombre = sesion?.bodega?.nombre || 'Mi Bodega';
      const usuarioActivo = sesion?.usuario || null;
      const [listaCajeros, setListaCajeros] = useState([]);
      const [cajeroSeleccionado, setCajeroSeleccionado] = useState(null);

      // --- Productos & Búsqueda ---
      const [productos, setProductos] = useState([]);
      const [categoriaFiltro, setCategoriaFiltro] = useState('TODOS');
      const [busqueda, setBusqueda] = useState('');
      const [cargandoProductos, setCargandoProductos] = useState(false);

      // --- Turno de Caja ---
      const [turnoActivo, setTurnoActivo] = useState(null);
      const [modalTurno, setModalTurno] = useState(false);
      const [montoApertura, setMontoApertura] = useState('100.00');
      const [mostrarFormNuevoCajero, setMostrarFormNuevoCajero] = useState(false);
      const [formNuevoCajero, setFormNuevoCajero] = useState({ nombre: '', dni: '', rol: 'cajero' });

      // --- Arqueo y Cierre de Caja ---
      const [modalCierreCaja, setModalCierreCaja] = useState(false);
      const [montoConteoEfectivo, setMontoConteoEfectivo] = useState('');
      const [resumenCierre, setResumenCierre] = useState(null);

      // --- Carrito & Ventas en Espera (Park Sales) ---
      const [carrito, setCarrito] = useState([]);
      const [ventasEnEspera, setVentasEnEspera] = useState(() => {
        const p = localStorage.getItem('pos_ventas_espera');
        return p ? JSON.parse(p) : [];
      });
      const [modalVentasEspera, setModalVentasEspera] = useState(false);

      // --- Modal de Cantidad / Balanza (Gramos / Unidades) ---
      const [modalCantidad, setModalCantidad] = useState(false);
      const [productoSeleccionadoCantidad, setProductoSeleccionadoCantidad] = useState(null);
      const [inputCantidad, setInputCantidad] = useState('1');

      // --- Cliente & Créditos ---
      const [dniCliente, setDniCliente] = useState('99999999');
      const [clienteActual, setClienteActual] = useState(null);
      const [modalNuevoCliente, setModalNuevoCliente] = useState(false);
      const [formCliente, setFormCliente] = useState({ dni: '', nombre: '', telefono: '', correo: '', limiteCredito: '300.00' });
      const [modalCobrarDeudas, setModalCobrarDeudas] = useState(false);
      const [clientesDeudores, setClientesDeudores] = useState([]);
      const [deudorSeleccionado, setDeudorSeleccionado] = useState(null);
      const [montoAbonoDeuda, setMontoAbonoDeuda] = useState('');

      // --- Módulo: Nuevo Producto (Catálogo) ---
      const [modalNuevoProducto, setModalNuevoProducto] = useState(false);
      const [formProducto, setFormProducto] = useState({
        cod_ean: '',
        descripcion: '',
        precio_costo: '',
        precio_venta: '',
        categoria: 'Abarrotes',
        unidad: 'UND'
      });

      // --- Módulo: Entrada de Mercadería (Compras) ---
      const [modalEntradaMercaderia, setModalEntradaMercaderia] = useState(false);
      const [compraCabecera, setCompraCabecera] = useState({ proveedor: 'Distribuidora Central', ruc: '', nroComprobante: '' });
      const [compraItems, setCompraItems] = useState([]);
      const [compraItemTemp, setCompraItemTemp] = useState({ productoId: '', cantidad: 1, costoUnitario: '' });

      // --- Módulo: Historial de Ventas del Día ---
      const [modalHistorial, setModalHistorial] = useState(false);
      const [ventasDelDia, setVentasDelDia] = useState([]);
      const [cargandoHistorial, setCargandoHistorial] = useState(false);

      // --- Cobro / Pagos ---
      const [medioPago, setMedioPago] = useState('EFECTIVO');
      const [montoRecibido, setMontoRecibido] = useState('');
      const [montoMixtoOtro, setMontoMixtoOtro] = useState(''); // monto fijo pagado con tarjeta/otro
      const [montoMixtoRecibido, setMontoMixtoRecibido] = useState(''); // efectivo físico entregado por el cliente
      const [campoTeclado, setCampoTeclado] = useState(null); // 'recibido' | 'mixtoOtro' | 'mixtoRecibido' | null
      const [procesandoVenta, setProcesandoVenta] = useState(false);
      const [ventaCompletada, setVentaCompletada] = useState(null);
      const [medioQR, setMedioQR] = useState(null); // 'YAPE' | 'PLIN' | null
      const [reciboReimpresion, setReciboReimpresion] = useState(null);

      // --- Diagnóstico y Notificaciones ---
      const [errorDetalle, setErrorDetalle] = useState(null);
      const [toast, setToast] = useState({ visible: false, texto: '', tipo: 'info' });
      const [menuMas, setMenuMas] = useState(false);
      const [mostrarResumenMobile, setMostrarResumenMobile] = useState(false);
      const inputBusquedaRef = useRef(null);

      // Cliente Supabase
      const sbClient = useMemo(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            return window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
          } catch (e) {
            console.error('Error Supabase client:', e);
            return null;
          }
        }
        return null;
      }, [supabaseUrl, supabaseKey]);

      const notificar = (texto, tipo = 'info') => {
        setToast({ visible: true, texto, tipo });
        setTimeout(() => setToast({ visible: false, texto: '', tipo: 'info' }), 4000);
      };

      const guardarSesion = (datos) => {
        setSesion(datos);
        localStorage.setItem('pos_user_session', JSON.stringify(datos));
      };

      const cerrarSesion = () => {
        setSesion(null);
        setCajeroSeleccionado(null);
        localStorage.removeItem('pos_user_session');
        setCarrito([]);
        setTurnoActivo(null);
        notificar('Has cerrado sesión.', 'info');
      };

      // Guardar ventas en espera
      const guardarVentasEnEsperaLS = (lista) => {
        setVentasEnEspera(lista);
        localStorage.setItem('pos_ventas_espera', JSON.stringify(lista));
      };

      // Cargar cajeros
      const cargarCajeros = async () => {
        if (!sbClient || !bodegaId) return;
        try {
          const { data } = await sbClient
            .from('cajeros')
            .select('*')
            .eq('bodega_id', bodegaId)
            .eq('activo', true)
            .order('nombre', { ascending: true });

          const cjs = data || [];
          setListaCajeros(cjs);
          if (cjs.length > 0 && !cajeroSeleccionado) {
            setCajeroSeleccionado(cjs[0]);
          }
        } catch (err) {
          console.warn(err);
        }
      };

      // ==========================================
      // PRODUCTOS & CATÁLOGO
      // ==========================================
      const cargarProductos = async (termino = '') => {
        if (!bodegaId) return;
        setCargandoProductos(true);
        if (sbClient) {
          try {
            let query = sbClient
              .from('productos')
              .select('*')
              .eq('bodega_id', bodegaId)
              .order('descripcion', { ascending: true });

            if (termino.trim()) {
              const b = termino.trim();
              query = query.or(`cod_ean.ilike.%${b}%,descripcion.ilike.%${b}%,categoria.ilike.%${b}%`);
            }

            const { data, error } = await query;
            if (error) throw error;

            if (data && data.length > 0) {
              setProductos(data);
            } else {
              const demo = PRODUCTOS_SEMILLA.map((p, i) => ({ ...p, id: i + 1, bodega_id: bodegaId }));
              setProductos(demo);
            }
          } catch (err) {
            const demo = PRODUCTOS_SEMILLA.map((p, i) => ({ ...p, id: i + 1, bodega_id: bodegaId }));
            setProductos(demo);
          } finally {
            setCargandoProductos(false);
          }
        } else {
          const demo = PRODUCTOS_SEMILLA.map((p, i) => ({ ...p, id: i + 1, bodega_id: bodegaId }));
          setProductos(demo);
          setCargandoProductos(false);
        }
      };

      useEffect(() => {
        if (sesion && bodegaId) {
          cargarProductos(busqueda);
          cargarCajeros();
          obtenerOCrearCliente('99999999');
          verificarTurno();
        }
      }, [sesion, bodegaId, sbClient]);

      // Categorías
      const categorias = useMemo(() => {
        const cats = new Set(productos.map(p => p.categoria).filter(Boolean));
        return ['TODOS', ...Array.from(cats)];
      }, [productos]);

      const productosFiltrados = useMemo(() => {
        if (categoriaFiltro === 'TODOS') return productos;
        return productos.filter(p => p.categoria === categoriaFiltro);
      }, [productos, categoriaFiltro]);

      // ==========================================
      // SELECCIÓN Y CANTIDAD / BALANZA DE PRODUCTO
      // ==========================================
      const handleClicProducto = (prod) => {
        const esKG = prod.unidad === 'KG' || (prod.descripcion || '').toLowerCase().includes('kg');
        if (esKG) {
          setProductoSeleccionadoCantidad(prod);
          setInputCantidad('1.000');
          setModalCantidad(true);
        } else {
          agregarAlCarrito(prod, 1);
        }
      };

      const confirmarCantidadBalanza = () => {
        if (!productoSeleccionadoCantidad) return;
        const cant = parseFloat(inputCantidad) || 1;
        if (cant <= 0) {
          notificar('Ingresa una cantidad válida.', 'error');
          return;
        }
        agregarAlCarrito(productoSeleccionadoCantidad, cant);
        setModalCantidad(false);
        setProductoSeleccionadoCantidad(null);
      };

      const agregarAlCarrito = (producto, cantidad = 1) => {
        const cantNum = parseFloat(cantidad) || 1;
        setCarrito(prev => {
          const idx = prev.findIndex(item => item.productoId === producto.id);
          const precioUnit = Number(producto.precio_venta) || 0;
          if (idx >= 0) {
            const actual = prev[idx];
            const nuevaCant = +(actual.cantidad + cantNum).toFixed(3);
            const nuevo = [...prev];
            nuevo[idx] = {
              ...actual,
              cantidad: nuevaCant,
              subtotal: +(nuevaCant * actual.precioUnitario).toFixed(2)
            };
            return nuevo;
          } else {
            return [
              ...prev,
              {
                productoId: producto.id,
                cod_ean: producto.cod_ean,
                descripcion: producto.descripcion,
                precioUnitario: precioUnit,
                cantidad: cantNum,
                subtotal: +(cantNum * precioUnit).toFixed(2),
                unidad: producto.unidad || 'UND'
              }
            ];
          }
        });
        notificar(`Añadido: ${producto.descripcion}`, 'success');
      };

      // ==========================================
      // LECTOR DE CÓDIGO DE BARRAS / BUSCADOR
      // ==========================================
      const handleKeyDownBusqueda = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const term = busqueda.trim().toLowerCase();
          if (!term) return;

          const exactoEan = productos.find(p => (p.cod_ean || '').toLowerCase() === term);
          if (exactoEan) {
            handleClicProducto(exactoEan);
            setBusqueda('');
            return;
          }

          const coincidencias = productos.filter(
            p => (p.descripcion || '').toLowerCase().includes(term) || (p.cod_ean || '').includes(term)
          );
          if (coincidencias.length === 1) {
            handleClicProducto(coincidencias[0]);
            setBusqueda('');
          } else {
            cargarProductos(term);
          }
        }
      };

      const cambiarCantidadCarrito = (productoId, delta) => {
        setCarrito(prev =>
          prev.map(item => {
            if (item.productoId === productoId) {
              const step = item.unidad === 'KG' ? 0.250 : 1;
              const nCant = +(item.cantidad + (delta * step)).toFixed(3);
              if (nCant <= 0) return null;
              return {
                ...item,
                cantidad: nCant,
                subtotal: +(nCant * item.precioUnitario).toFixed(2)
              };
            }
            return item;
          }).filter(Boolean)
        );
      };

      const eliminarItemCarrito = (productoId) => {
        setCarrito(prev => prev.filter(item => item.productoId !== productoId));
      };

      const totalVenta = useMemo(() => {
        return +carrito.reduce((acc, item) => acc + item.subtotal, 0).toFixed(2);
      }, [carrito]);

      const vuelto = useMemo(() => {
        if (medioPago !== 'EFECTIVO' || !montoRecibido) return 0;
        const recibido = parseFloat(montoRecibido) || 0;
        return +(recibido - totalVenta).toFixed(2);
      }, [montoRecibido, totalVenta, medioPago]);

      // Monto que debe cubrirse en efectivo dentro de un pago mixto: el total
      // menos lo que ya se cubrió con tarjeta/otro (nunca negativo, ni mayor al total).
      const efectivoRequeridoMixto = useMemo(() => {
        const otro = Math.min(parseFloat(montoMixtoOtro) || 0, totalVenta);
        return +Math.max(0, totalVenta - otro).toFixed(2);
      }, [montoMixtoOtro, totalVenta]);

      // Vuelto del pago mixto: lo que el cliente entregó en efectivo físico
      // menos lo que realmente debía cubrir en efectivo.
      const vueltoMixto = useMemo(() => {
        if (!montoMixtoRecibido) return 0;
        const recibido = parseFloat(montoMixtoRecibido) || 0;
        return +(recibido - efectivoRequeridoMixto).toFixed(2);
      }, [montoMixtoRecibido, efectivoRequeridoMixto]);

      const asignarDesdeTeclado = (texto) => {
        if (campoTeclado === 'recibido') setMontoRecibido(texto);
        if (campoTeclado === 'mixtoOtro') setMontoMixtoOtro(texto);
        if (campoTeclado === 'mixtoRecibido') setMontoMixtoRecibido(texto);
      };

      const valorTeclado = campoTeclado === 'recibido' ? montoRecibido
        : campoTeclado === 'mixtoOtro' ? montoMixtoOtro
        : campoTeclado === 'mixtoRecibido' ? montoMixtoRecibido
        : '';

      // ==========================================
      // ⏸️ VENTAS EN ESPERA (PARK SALES)
      // ==========================================
      const aparcarVentaActual = () => {
        if (carrito.length === 0) return;
        const nuevaVentaEspera = {
          id: Date.now(),
          hora: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }),
          items: [...carrito],
          total: totalVenta,
          cliente: clienteActual
        };

        const nuevaLista = [...ventasEnEspera, nuevaVentaEspera];
        guardarVentasEnEsperaLS(nuevaLista);
        setCarrito([]);
        notificar('Venta puesta en espera ⏸️', 'info');
      };

      const recuperarVentaEspera = (index) => {
        const v = ventasEnEspera[index];
        if (!v) return;
        setCarrito(v.items);
        if (v.cliente) setClienteActual(v.cliente);
        const nuevaLista = ventasEnEspera.filter((_, i) => i !== index);
        guardarVentasEnEsperaLS(nuevaLista);
        setModalVentasEspera(false);
        notificar('Venta recuperada al carrito.', 'success');
      };

      const borrarVentaEspera = (index) => {
        const nuevaLista = ventasEnEspera.filter((_, i) => i !== index);
        guardarVentasEnEsperaLS(nuevaLista);
        notificar('Venta en espera eliminada.', 'info');
      };

      // ==========================================
      // CLIENTE & GESTIÓN DE CRÉDITOS
      // ==========================================
      const obtenerOCrearCliente = async (dni = '99999999') => {
        const dniLimpio = dni.trim() || '99999999';
        if (!sbClient || !bodegaId) {
          const mock = { id: generarUUID(), bodega_id: bodegaId, dni: dniLimpio, nombre_completo: dniLimpio === '99999999' ? 'Desconocido' : `CLIENTE DNI ${dniLimpio}`, saldo_actual: 0 };
          setClienteActual(mock);
          return mock;
        }

        try {
          const { data } = await sbClient
            .from('clientes')
            .select('*')
            .eq('bodega_id', bodegaId)
            .eq('dni', dniLimpio)
            .maybeSingle();

          if (data) {
            setClienteActual(data);
            return data;
          }

          const nuevo = {
            bodega_id: bodegaId,
            dni: dniLimpio,
            nombre_completo: dniLimpio === '99999999' ? 'Desconocido' : `CLIENTE DNI ${dniLimpio}`,
            saldo_actual: 0.00
          };

          const { data: creado } = await sbClient
            .from('clientes')
            .insert([nuevo])
            .select()
            .single();

          setClienteActual(creado || nuevo);
          return creado || nuevo;
        } catch (err) {
          console.warn(err);
        }
      };

      const handleGuardarNuevoCliente = async (e) => {
        e.preventDefault();
        const { dni, nombre, telefono, correo, limiteCredito } = formCliente;
        if (!dni.trim() || !nombre.trim()) {
          notificar('DNI y Nombre son obligatorios.', 'error');
          return;
        }
        const limite = Number(limiteCredito) || 0;

        try {
          if (sbClient) {
            const { data, error } = await sbClient
              .from('clientes')
              .insert([{
                bodega_id: bodegaId,
                dni: dni.trim(),
                nombre_completo: nombre.trim(),
                telefono: telefono.trim() || null,
                correo: correo.trim() || null,
                limite_credito: limite,
                saldo_actual: 0.00
              }])
              .select()
              .single();

            if (error) throw error;
            setClienteActual(data);
            setDniCliente(data.dni);
          } else {
            const cLocal = { id: generarUUID(), bodega_id: bodegaId, dni: dni.trim(), nombre_completo: nombre.trim(), telefono, correo, limite_credito: limite, saldo_actual: 0 };
            setClienteActual(cLocal);
            setDniCliente(cLocal.dni);
          }

          setModalNuevoCliente(false);
          setFormCliente({ dni: '', nombre: '', telefono: '', correo: '', limiteCredito: '300.00' });
          notificar(`¡Cliente "${nombre}" registrado con éxito!`, 'success');
        } catch (err) {
          notificar(`Error: ${err.message}`, 'error');
        }
      };

      // Cargar deudores
      const abrirModuloCobroDeudas = async () => {
        setModalCobrarDeudas(true);
        if (sbClient && bodegaId) {
          try {
            const { data } = await sbClient
              .from('clientes')
              .select('*')
              .eq('bodega_id', bodegaId)
              .gt('saldo_actual', 0)
              .order('saldo_actual', { ascending: false });

            setClientesDeudores(data || []);
          } catch (err) {
            console.warn(err);
          }
        }
      };

      const procesarPagoDeudaCliente = async () => {
        if (!deudorSeleccionado) return;
        const abono = parseFloat(montoAbonoDeuda) || 0;
        if (abono <= 0) {
          notificar('Ingresa un monto de abono mayor a 0.', 'error');
          return;
        }

        const saldoAnterior = Number(deudorSeleccionado.saldo_actual) || 0;
        const nuevoSaldo = Math.max(0, +(saldoAnterior - abono).toFixed(2));

        if (sbClient) {
          try {
            await sbClient
              .from('clientes')
              .update({ saldo_actual: nuevoSaldo })
              .eq('id', deudorSeleccionado.id);
          } catch (err) {
            console.error(err);
          }
        }

        // Lanzar Confeti 🎉
        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });

        notificar(`¡Pago de S/ ${abono.toFixed(2)} registrado! Saldo restante: S/ ${nuevoSaldo.toFixed(2)}`, 'success');
        setMontoAbonoDeuda('');
        setDeudorSeleccionado(null);
        abrirModuloCobroDeudas();
      };

      // ==========================================
      // NUEVO PRODUCTO (CATÁLOGO)
      // ==========================================
      const handleCrearNuevoProducto = async (e) => {
        e.preventDefault();
        const { descripcion, precio_venta, precio_costo, cod_ean, categoria, unidad } = formProducto;
        if (!descripcion.trim() || !precio_venta) {
          notificar('Descripción y Precio de Venta son obligatorios.', 'error');
          return;
        }

        try {
          const payload = {
            bodega_id: bodegaId,
            descripcion: descripcion.trim(),
            cod_ean: cod_ean.trim() || null,
            precio_costo: Number(precio_costo) || 0,
            precio_venta: Number(precio_venta) || 0,
            categoria: categoria.trim() || 'General'
          };

          if (sbClient) {
            const { error } = await sbClient.from('productos').insert([payload]);
            if (error) throw error;
          }

          setModalNuevoProducto(false);
          setFormProducto({ cod_ean: '', descripcion: '', precio_costo: '', precio_venta: '', categoria: 'Abarrotes', unidad: 'UND' });
          cargarProductos();
          notificar(`¡Producto "${descripcion}" guardado en el catálogo!`, 'success');
        } catch (err) {
          notificar(`Error: ${err.message}`, 'error');
        }
      };

      // ==========================================
      // ENTRADA DE MERCADERÍA (COMPRAS)
      // ==========================================
      const agregarItemEntradaMercaderia = () => {
        const prod = productos.find(p => p.id === compraItemTemp.productoId);
        if (!prod || !compraItemTemp.costoUnitario) {
          notificar('Selecciona producto y costo unitario.', 'error');
          return;
        }
        const cant = Number(compraItemTemp.cantidad) || 1;
        const costo = Number(compraItemTemp.costoUnitario) || 0;
        const sub = +(cant * costo).toFixed(2);

        setCompraItems(prev => [
          ...prev,
          {
            productoId: prod.id,
            descripcion: prod.descripcion,
            cantidad: cant,
            costoUnitario: costo,
            subtotal: sub
          }
        ]);
        setCompraItemTemp({ productoId: '', cantidad: 1, costoUnitario: '' });
      };

      const guardarEntradaMercaderia = async () => {
        if (compraItems.length === 0) {
          notificar('Agrega productos a la compra.', 'error');
          return;
        }
        const totalCompra = compraItems.reduce((acc, i) => acc + i.subtotal, 0);

        try {
          if (sbClient) {
            const { data: cData, error: cErr } = await sbClient
              .from('compras')
              .insert([{
                bodega_id: bodegaId,
                cajero_id: cajeroSeleccionado?.id,
                nro_comprobante: compraCabecera.nroComprobante || `COMP-${Date.now().toString().slice(-6)}`,
                total_compra: totalCompra,
                fecha: new Date().toISOString()
              }])
              .select()
              .single();

            if (!cErr && cData) {
              const detalles = compraItems.map(item => ({
                compra_id: cData.id,
                producto_id: item.productoId,
                cantidad: item.cantidad,
                costo_unitario: item.costoUnitario,
                subtotal: item.subtotal
              }));
              await sbClient.from('compras_detalle').insert(detalles);

              // Actualizar precio de costo en productos
              for (const it of compraItems) {
                await sbClient
                  .from('productos')
                  .update({ precio_costo: it.costoUnitario })
                  .eq('id', it.productoId);
              }
            }
          }

          setModalEntradaMercaderia(false);
          setCompraItems([]);
          cargarProductos();
          notificar(`¡Entrada de mercadería por S/ ${totalCompra.toFixed(2)} registrada!`, 'success');
        } catch (err) {
          notificar(`Error: ${err.message}`, 'error');
        }
      };

      // ==========================================
      // HISTORIAL DE VENTAS DEL DÍA & ANULACIÓN
      // ==========================================
      const abrirHistorialDelDia = async () => {
        setModalHistorial(true);
        setCargandoHistorial(true);
        if (sbClient && bodegaId) {
          try {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            const { data, error } = await sbClient
              .from('ventas')
              .select('*, clientes(nombre_completo), ventas_detalle(*, productos(descripcion))')
              .eq('bodega_id', bodegaId)
              .gte('fecha_hora', hoy.toISOString())
              .order('fecha_hora', { ascending: false });

            if (error) throw error;
            setVentasDelDia(data || []);
          } catch (err) {
            console.warn(err);
            notificar(`No se pudo cargar el historial: ${err.message}`, 'error');
          } finally {
            setCargandoHistorial(false);
          }
        } else {
          setCargandoHistorial(false);
        }
      };

      const anularVentaHoy = async (venta) => {
        if (venta.anulada) return;
        if (!confirm(`¿Estás seguro de ANULAR la boleta ${venta.nro_boleta}? Esta acción no se puede deshacer.`)) return;

        const motivo = prompt('Motivo de la anulación (opcional):', '') || 'Sin motivo especificado';

        try {
          if (sbClient) {
            // Si la venta era a crédito, revertir la deuda del cliente antes de anular
            if (venta.medio_pago === 'CREDITO' && venta.cliente_id) {
              const { data: cli } = await sbClient
                .from('clientes')
                .select('saldo_actual')
                .eq('id', venta.cliente_id)
                .single();
              if (cli) {
                const nuevoSaldo = Math.max(0, +(Number(cli.saldo_actual) - Number(venta.total_venta)).toFixed(2));
                await sbClient.from('clientes').update({ saldo_actual: nuevoSaldo }).eq('id', venta.cliente_id);
              }
            }

            // Soft-delete: se marca como anulada en vez de borrarla, para conservar el historial
            await sbClient
              .from('ventas')
              .update({ anulada: true, motivo_anulacion: motivo })
              .eq('id', venta.id);
          }
          setVentasDelDia(prev => prev.map(v => v.id === venta.id ? { ...v, anulada: true, motivo_anulacion: motivo } : v));
          notificar(`Boleta ${venta.nro_boleta} anulada correctamente.`, 'info');
        } catch (err) {
          notificar(`Error al anular: ${err.message}`, 'error');
        }
      };

      // ==========================================
      // ARQUEO Y CIERRE DE CAJA
      // ==========================================
      const handleCierreConArqueo = async () => {
        if (!turnoActivo) return;
        const montoReal = parseFloat(montoConteoEfectivo) || 0;
        const montoIni = Number(turnoActivo.monto_inicial) || 0;

        // Calcular ventas en efectivo del turno
        let ventasEfectivo = 0;
        if (sbClient) {
          const { data: vts } = await sbClient
            .from('ventas')
            .select('total_venta')
            .eq('turno_caja_id', turnoActivo.id)
            .eq('medio_pago', 'EFECTIVO');

          ventasEfectivo = (vts || []).reduce((acc, v) => acc + Number(v.total_venta), 0);
        }

        const esperado = +(montoIni + ventasEfectivo).toFixed(2);
        const dif = +(montoReal - esperado).toFixed(2);

        if (sbClient) {
          try {
            await sbClient
              .from('turnos_caja')
              .update({
                fecha_cierre: new Date().toISOString(),
                monto_final_real: montoReal,
                ventas_sistema: ventasEfectivo,
                diferencia: dif,
                estado: 'cerrado'
              })
              .eq('id', turnoActivo.id);
          } catch (err) {
            console.error(err);
          }
        }

        setResumenCierre({
          inicio: montoIni,
          ventas: ventasEfectivo,
          esperado,
          real: montoReal,
          diferencia: dif
        });

        setModalCierreCaja(false);
        setTurnoActivo(null);
        setMontoConteoEfectivo('');
      };

      // Turno activo check
      const verificarTurno = async () => {
        if (!sbClient || !bodegaId) return;
        try {
          // Un turno se considera abierto si su estado lo indica O si aún no tiene
          // fecha_cierre (indicador más confiable, no depende de qué texto haya
          // quedado guardado en `estado`).
          const { data } = await sbClient
            .from('turnos_caja')
            .select('*')
            .eq('bodega_id', bodegaId)
            .or('estado.ilike.%abierto%,estado.ilike.%open%,estado.ilike.%activo%,fecha_cierre.is.null')
            .order('fecha_apertura', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (data) setTurnoActivo(data);
        } catch (err) {
          console.warn(err);
        }
      };

      // Abrir turno
      const handleAbrirTurno = async () => {
        const monto = parseFloat(montoApertura) || 0;
        const cajeroFinal = cajeroSeleccionado || listaCajeros[0];

        if (!cajeroFinal || !cajeroFinal.id) {
          notificar('Selecciona un cajero.', 'error');
          return;
        }

        if (sbClient) {
          try {
            let { data, error } = await sbClient
              .from('turnos_caja')
              .insert([{
                bodega_id: bodegaId,
                cajero_id: cajeroFinal.id,
                monto_inicial: monto,
                fecha_apertura: new Date().toISOString(),
                ventas_sistema: 0.00,
                estado: 'ABIERTO'
              }])
              .select()
              .single();

            if (data) {
              setTurnoActivo(data);
              setModalTurno(false);
              notificar(`Turno abierto con: ${cajeroFinal.nombre}`, 'success');
              return;
            }
          } catch (err) {
            console.warn(err);
          }
        }

        setTurnoActivo({ id: generarUUID(), bodega_id: bodegaId, cajero_id: cajeroFinal.id, monto_inicial: monto, estado: 'abierto', fecha_apertura: new Date().toISOString() });
        setModalTurno(false);
        notificar('Turno abierto.', 'info');
      };

      // Cobrar venta
      const handleCobrar = async () => {
        if (carrito.length === 0) {
          notificar('El carrito está vacío.', 'error');
          return;
        }
        if (medioPago === 'EFECTIVO' && montoRecibido && parseFloat(montoRecibido) < totalVenta) {
          notificar('Monto recibido insuficiente.', 'error');
          return;
        }

        // Validación de crédito: Saldo actual + Venta <= Límite
        if (medioPago === 'CREDITO') {
          if (!clienteActual || clienteActual.dni === '99999999') {
            notificar('Para vender a crédito debes seleccionar un cliente registrado.', 'error');
            setModalNuevoCliente(true);
            return;
          }
          const limiteCred = Number(clienteActual.limite_credito) || 0;
          const saldoAct = Number(clienteActual.saldo_actual) || 0;
          const nuevoSaldoProyectado = +(saldoAct + totalVenta).toFixed(2);
          if (nuevoSaldoProyectado > limiteCred) {
            const disponible = Math.max(0, +(limiteCred - saldoAct).toFixed(2));
            notificar(`Límite de crédito excedido. Disponible: S/ ${disponible.toFixed(2)} de S/ ${limiteCred.toFixed(2)}.`, 'error');
            return;
          }
        }

        // Validación de pago mixto: el efectivo entregado debe alcanzar para cubrir
        // lo que no se pagó con tarjeta/otro (el vuelto se calcula, no se exige exacto).
        let montoEfectivoMixto = 0;
        let montoOtroMixto = 0;
        if (medioPago === 'MIXTO') {
          montoOtroMixto = Math.min(parseFloat(montoMixtoOtro) || 0, totalVenta);
          montoEfectivoMixto = efectivoRequeridoMixto;
          const recibidoMixto = parseFloat(montoMixtoRecibido) || 0;
          if (montoEfectivoMixto > 0 && recibidoMixto < montoEfectivoMixto) {
            notificar(`Falta efectivo: debes recibir al menos S/ ${montoEfectivoMixto.toFixed(2)} en efectivo.`, 'error');
            return;
          }
        }

        setProcesandoVenta(true);
        const correlativo = `B001-${String(Date.now()).slice(-8)}`;

        try {
          if (sbClient) {
            const idTurnoReal = turnoActivo?.id;
            const cajeroFinal = cajeroSeleccionado || listaCajeros[0];

            let idClienteReal = clienteActual?.id;
            const payloadVenta = {
              bodega_id: bodegaId,
              turno_caja_id: idTurnoReal || null,
              cajero_id: cajeroFinal?.id,
              cliente_id: idClienteReal || null,
              nro_boleta: correlativo,
              medio_pago: medioPago,
              total_venta: totalVenta,
              monto_efectivo: medioPago === 'MIXTO' ? montoEfectivoMixto : 0,
              monto_otro: medioPago === 'MIXTO' ? montoOtroMixto : 0
            };

            const { data: vCreada, error: vErr } = await sbClient
              .from('ventas')
              .insert([payloadVenta])
              .select()
              .single();

            if (vErr) throw vErr;

            const payloadDetalles = carrito.map(item => ({
              venta_id: vCreada.id,
              producto_id: typeof item.productoId === 'string' && item.productoId.length > 10 ? item.productoId : null,
              cantidad: Number(item.cantidad),
              precio_unitario: Number(item.precioUnitario),
              subtotal: Number(item.subtotal)
            }));

            const { error: detErr } = await sbClient.from('ventas_detalle').insert(payloadDetalles);
            if (detErr) {
              console.error('Error al guardar el detalle de la venta:', detErr);
              notificar(`Venta registrada, pero el detalle de productos no se guardó: ${detErr.message}`, 'error');
            }

            // Si es crédito, actualizar saldo
            if (medioPago === 'CREDITO' && idClienteReal) {
              const saldoAct = Number(clienteActual.saldo_actual) || 0;
              await sbClient
                .from('clientes')
                .update({ saldo_actual: +(saldoAct + totalVenta).toFixed(2) })
                .eq('id', idClienteReal);
            }
          }

          const resultado = {
            nro_boleta: correlativo,
            medio_pago: medioPago,
            total_venta: totalVenta,
            items: [...carrito],
            cliente: clienteActual?.nombre_completo || 'Desconocido',
            cajero: cajeroSeleccionado?.nombre || usuarioActivo?.nombre || 'Cajero',
            fecha: new Date().toLocaleTimeString()
          };

          setVentaCompletada(resultado);
          setCarrito([]);
          setMontoRecibido('');
          setMontoMixtoOtro('');

                    <span className="text-[11px] text-rose-400 font-bold">

            {/* Encabezado Carrito */}

              <div className="flex gap-2">

                  <button
                    onClick={aparcarVentaActual}

                  <div
                    key={item.productoId}
                    className="flex items-center gap-2.5 p-2.5 bg-stone-800/40 border border-stone-800 rounded-xl hover:border-stone-700 transition"

                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold text-stone-100 truncate">
                        {item.descripcion}
                      </p>
                      <p className="text-[10px] text-stone-500 tabular-nums">
                        S/ {item.precioUnitario.toFixed(2)} / {item.unidad || 'UND'}
                      </p>
                    </div>

                    <div className="flex items-center gap-1 bg-stone-900 p-1 rounded-lg border border-stone-700 shrink-0">
                      <button
                        onClick={() => cambiarCantidadCarrito(item.productoId, -1)}

                        <i className="fa-solid fa-minus text-[9px]"></i>
                      </button>
                      <span className="w-9 text-center text-xs font-bold text-orange-400 tabular-nums">
                        {item.cantidad}
                      </span>
                      <button
                        onClick={() => cambiarCantidadCarrito(item.productoId, 1)}
                        className="w-6 h-6 flex items-center justify-center text-xs text-stone-400 hover:bg-stone-700 hover:text-white rounded-md transition"
                      >
                        <i className="fa-solid fa-plus text-[9px]"></i>
                      </button>
                    </div>

                    <div className="w-[68px] text-right shrink-0">
                      <span className="text-xs font-bold text-white block tabular-nums">
                        S/ {item.subtotal.toFixed(2)}
                      </span>
                      <button
                        onClick={() => eliminarItemCarrito(item.productoId)}
                        className="text-[10px] text-stone-500 hover:text-rose-400 transition"
                      >
                        <i className="fa-solid fa-trash-can text-[9px]"></i> Quitar
                      </button>
                    </div>
                  </div>

                    { id: 'EFECTIVO', icono: 'fa-money-bill-wave', texto: 'Efectivo' },
                    { id: 'YAPE', icono: 'fa-mobile-screen', texto: 'Yape' },
                    { id: 'PLIN', icono: 'fa-mobile-screen', texto: 'Plin' },
                    { id: 'TARJETA', icono: 'fa-credit-card', texto: 'Tarjeta' },
                    { id: 'CREDITO', icono: 'fa-file-invoice-dollar', texto: 'Crédito' },
                    { id: 'MIXTO', icono: 'fa-layer-group', texto: 'Mixto' }

                    <button
                      key={m.id}
                      onClick={() => { setMedioPago(m.id); setCampoTeclado(null); }}

                      <i className={`fa-solid ${m.icono} text-sm`}></i>
                      {m.texto}
                    </button>

              {medioPago === 'EFECTIVO' && (
                <div className="bg-stone-800/60 p-2 rounded-lg border border-stone-800 space-y-1">

                    <div>
                      <label className="text-[10px] text-stone-400 block">Paga con (S/):</label>
                      <input
                        type="text"
                        inputMode="decimal"
                        value={montoRecibido}
                        onFocus={() => setCampoTeclado('recibido')}
                        onChange={(e) => setMontoRecibido(e.target.value)}
                        placeholder="0.00"
                        className="w-full bg-stone-900 border border-stone-700 rounded px-2 py-0.5 text-xs font-bold text-white focus:outline-none focus:border-orange-500"

                    </div>
                    <div className="text-right">
                      <span className="text-[10px] text-stone-400 block">Vuelto:</span>
                      <span className={`text-sm font-black ${vuelto < 0 ? 'text-rose-400' : 'text-orange-400'}`}>

                  </div>

                </div>

                    onClick={() => setMedioQR(medioPago)}

                </div>

              {medioPago === 'CREDITO' && (
                <div className={`p-2 rounded-lg border text-[11px] ${

                }`}>
                  {(!clienteActual || clienteActual.dni === '99999999') ? (
                    'Asigna un cliente registrado para vender a crédito.'

                    <>Disponible: S/ {Math.max(0, (Number(clienteActual.limite_credito) || 0) - (Number(clienteActual.saldo_actual) || 0)).toFixed(2)} de S/ {(Number(clienteActual.limite_credito) || 0).toFixed(2)}</>
                  )}
                </div>
              )}

              {medioPago === 'MIXTO' && (
                <div className="bg-stone-800/60 p-2 rounded-lg border border-stone-800 space-y-1.5">
                  <div>
                    <label className="text-[10px] text-stone-400 block">Monto en Tarjeta/Otro (S/):</label>
                    <input
                      type="text"
                      inputMode="decimal"
                      value={montoMixtoOtro}
                      onFocus={() => setCampoTeclado('mixtoOtro')}
                      onChange={(e) => setMontoMixtoOtro(e.target.value)}
                      placeholder="0.00"
                      className="w-full bg-stone-900 border border-stone-700 rounded px-2 py-0.5 text-xs font-bold text-white focus:outline-none focus:border-orange-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1 border-t border-stone-800">
                    <div>
                      <label className="text-[10px] text-stone-400 block">Falta en efectivo:</label>
                      <span className="text-sm font-black text-amber-400">S/ {efectivoRequeridoMixto.toFixed(2)}</span>
                    </div>
                    <div className="text-right">
                      <label className="text-[10px] text-stone-400 block">Vuelto:</label>
                      <span className={`text-sm font-black ${vueltoMixto < 0 ? 'text-rose-400' : 'text-orange-400'}`}>
                        S/ {vueltoMixto > 0 ? vueltoMixto.toFixed(2) : '0.00'}
                      </span>
                    </div>
                  </div>

                  {efectivoRequeridoMixto > 0 && (
                    <div>
                      <label className="text-[10px] text-stone-400 block">Recibe en efectivo (S/):</label>
                      <input
                        type="text"
                        inputMode="decimal"
                        value={montoMixtoRecibido}
                        onFocus={() => setCampoTeclado('mixtoRecibido')}
                        onChange={(e) => setMontoMixtoRecibido(e.target.value)}
                        placeholder="0.00"
                        className="w-full bg-stone-900 border border-stone-700 rounded px-2 py-0.5 text-xs font-bold text-white focus:outline-none focus:border-orange-500"
                      />
                    </div>
                  )}

                  {(campoTeclado === 'mixtoOtro' || campoTeclado === 'mixtoRecibido') && (
                    <NumericKeypad value={valorTeclado} onChange={asignarDesdeTeclado} />
                  )}
                </div>
              )}

              <div className="flex items-center justify-between pt-1 pb-0.5 border-t border-stone-800">
                <span className="text-[11px] font-semibold text-stone-400 uppercase tracking-wider pt-2">
                  Total a Cobrar
                </span>
                <span className="text-2xl font-extrabold text-white tabular-nums pt-2">
                  S/ {totalVenta.toFixed(2)}
                </span>
              </div>

              <button
                onClick={handleCobrar}
                disabled={procesandoVenta || carrito.length === 0 || !turnoActivo}
                className={`w-full py-3.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${
                  !turnoActivo || procesandoVenta || carrito.length === 0
                    ? 'bg-stone-800 text-stone-600 cursor-not-allowed'
                    : 'bg-orange-500 hover:bg-orange-400 text-white shadow-lg shadow-orange-500/25 active:scale-[0.98]'
                }`}
              >
                {!turnoActivo ? (
                  <><i className="fa-solid fa-triangle-exclamation"></i> Abre un Turno para Cobrar</>
                ) : procesandoVenta ? (
                  <><i className="fa-solid fa-spinner fa-spin"></i> Registrando Venta...</>
                ) : medioPago === 'CREDITO' ? (
                  <><i className="fa-solid fa-file-invoice-dollar"></i> Registrar Venta a Crédito</>
                ) : (
                  <><i className="fa-solid fa-receipt"></i> Cobrar e Imprimir Boleta</>
                )}
              </button>

                  <i className="fa-solid fa-box-open w-5 text-orange-400"></i> Nuevo Producto
                </button>
                <button onClick={() => { setModalEntradaMercaderia(true); setMenuMas(false); }} className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-stone-800 flex items-center gap-3 text-stone-200 font-medium text-sm">
                  <i className="fa-solid fa-truck-ramp-box w-5 text-orange-400"></i> Entrada de Mercadería
                </button>
                <button onClick={() => { abrirModuloCobroDeudas(); setMenuMas(false); }} className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-stone-800 flex items-center gap-3 text-orange-400 font-semibold text-sm">
                  <i className="fa-solid fa-hand-holding-dollar w-5"></i> Cuentas por Cobrar
                </button>
                <button onClick={() => { abrirHistorialDelDia(); setMenuMas(false); }} className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-stone-800 flex items-center gap-3 text-stone-200 font-medium text-sm">
                  <i className="fa-solid fa-receipt w-5 text-orange-400"></i> Historial de Ventas Hoy
                </button>
                <button onClick={() => { setModalNuevoCliente(true); setMenuMas(false); }} className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-stone-800 flex items-center gap-3 text-stone-200 font-medium text-sm">
                  <i className="fa-solid fa-user-plus w-5 text-orange-400"></i> Registrar Cliente
                </button>
                <div className="border-t border-stone-800 my-1"></div>
                <button onClick={() => { cerrarSesion(); setMenuMas(false); }} className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-stone-800 flex items-center gap-3 text-rose-400 font-semibold text-sm">
                  <i className="fa-solid fa-right-from-bracket w-5"></i> Cerrar Sesión
                </button>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODALES ADICIONALES */}
          {/* ========================================================================= */}

          {/* Modal: Cantidad / Balanza para Peso KG */}

            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl space-y-4 text-center">
                <h3 className="text-sm font-bold text-white leading-tight">{productoSeleccionadoCantidad.descripcion}</h3>

                <div className="flex items-center justify-center gap-2">
                  <input
                    type="number"
                    step="0.005"
                    min="0.001"
                    value={inputCantidad}
                    onChange={(e) => setInputCantidad(e.target.value)}
                    className="w-32 bg-stone-950 border border-stone-800 text-center font-mono font-bold text-xl text-orange-400 p-2 rounded-xl focus:outline-none focus:border-orange-500"
                    autoFocus
                  />
                  <span className="text-sm font-bold text-stone-300">KG</span>
                </div>
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setModalCantidad(false)} className="flex-1 py-2 bg-stone-800 rounded-lg text-xs font-semibold">Cancelar</button>
                  <button onClick={confirmarCantidadBalanza} className="flex-1 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-bold shadow">Aceptar</button>
                </div>
              </div>
            </div>
          )}

                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">📦 Registrar Nuevo Producto</h3>
                  <button onClick={() => setModalNuevoProducto(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCrearNuevoProducto} className="space-y-2.5">
                  <div>
                    <label className="text-[11px] text-stone-400 block mb-1">Descripción / Nombre:</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Galletas Oreo x 6"
                      value={formProducto.descripcion}
                      onChange={(e) => setFormProducto({ ...formProducto, descripcion: e.target.value })}
                      className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Precio Venta (S/):</label>
                      <input
                        type="number"
                        step="0.10"
                        required
                        placeholder="0.00"
                        value={formProducto.precio_venta}
                        onChange={(e) => setFormProducto({ ...formProducto, precio_venta: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Precio Costo (S/):</label>
                      <input
                        type="number"
                        step="0.10"
                        placeholder="0.00"
                        value={formProducto.precio_costo}
                        onChange={(e) => setFormProducto({ ...formProducto, precio_costo: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Código EAN / Barras:</label>
                      <input
                        type="text"
                        placeholder="Opcional"
                        value={formProducto.cod_ean}
                        onChange={(e) => setFormProducto({ ...formProducto, cod_ean: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Unidad:</label>
                      <select
                        value={formProducto.unidad}
                        onChange={(e) => setFormProducto({ ...formProducto, unidad: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      >
                        <option value="UND">Unidad (UND)</option>
                        <option value="KG">Kilogramo (KG)</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl shadow mt-2">
                    Guardar Producto
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Entrada de Mercadería (Compras) */}

            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">

                  <h3 className="text-base font-bold text-white">📥 Entrada de Mercadería (Compras)</h3>
                  <button onClick={() => setModalEntradaMercaderia(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Proveedor / Distribuidor"
                    value={compraCabecera.proveedor}
                    onChange={(e) => setCompraCabecera({ ...compraCabecera, proveedor: e.target.value })}
                    className="bg-stone-950 border border-stone-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                  <input
                    type="text"
                    placeholder="N° Factura / Guía"
                    value={compraCabecera.nroComprobante}
                    onChange={(e) => setCompraCabecera({ ...compraCabecera, nroComprobante: e.target.value })}
                    className="bg-stone-950 border border-stone-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>

                {/* Agregar Ítem */}

                    />
                    <input
                      type="number"
                      step="0.10"
                      placeholder="Costo Unit."

                      onChange={(e) => setCompraItemTemp({ ...compraItemTemp, costoUnitario: e.target.value })}

                    <button
                      type="button"
                      onClick={agregarItemEntradaMercaderia}

                    </div>
