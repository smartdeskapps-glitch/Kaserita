      // ==========================================
      // MERMAS (pérdidas de producto: vencido, roto, robado, etc.)
      // ==========================================
      const registrarMermaProducto = async () => {
        const prod = productos.find((p) => p.id === formMerma.productoId);
        const cant = Number(formMerma.cantidad) || 0;
        if (!prod || cant <= 0) {
          notificar('Selecciona un producto y una cantidad válida.', 'error');
          return;
        }
        setGuardandoMerma(true);
        try {
          const totalCosto = +(cant * (Number(prod.precio_costo) || 0)).toFixed(2);
          if (sbClient) {
            const { error } = await sbClient.from('mermas').insert([{
              bodega_id: bodegaId,
              producto_id: prod.id,
              cajero_id: cajeroSeleccionado?.id || null,
              fecha: new Date().toISOString(),
              cantidad: cant,
              motivo: formMerma.motivo,
              total_costo: totalCosto
            }]);
            if (error) throw error;

            // Descuenta la merma del stock, igual que una venta (ajuste atómico)
            await sbClient.rpc('ajustar_stock', { p_producto_id: prod.id, p_delta: -cant });
          }
          setModalMerma(false);
          setFormMerma({ productoId: '', cantidad: '', motivo: 'Vencido' });
          cargarProductos(busqueda);
          notificar(`Merma registrada: ${cant} x ${prod.descripcion} (S/ ${totalCosto.toFixed(2)}).`, 'info');
        } catch (err) {
          notificar(`Error al registrar la merma: ${err.message}`, 'error');
        } finally {
          setGuardandoMerma(false);
        }
      };

      // ==========================================
      // ENTRADA DE MERCADERÍA (COMPRAS)
      // ==========================================
      const agregarItemEntradaMercaderia = () => {
        const prod = productos.find(p => p.id === compraItemTemp.productoId);
        if (!prod || !compraItemTemp.costoUnitario) {
          notificar('Selecciona producto y costo unitario.', 'error');
          return;
        }
        const cant = Number(compraItemTemp.cantidad) || 1;
        const costo = Number(compraItemTemp.costoUnitario) || 0;
        const sub = +(cant * costo).toFixed(2);

        setCompraItems(prev => [
          ...prev,
          {
            productoId: prod.id,
            descripcion: prod.descripcion,
            cantidad: cant,
            costoUnitario: costo,
            subtotal: sub
          }
        ]);
        setCompraItemTemp({ productoId: '', cantidad: 1, costoUnitario: '' });
      };

      const guardarEntradaMercaderia = async () => {
        if (compraItems.length === 0) {
          notificar('Agrega productos a la compra.', 'error');
          return;
        }
        const totalCompra = compraItems.reduce((acc, i) => acc + i.subtotal, 0);

        try {
          if (sbClient) {
            const { data: cData, error: cErr } = await sbClient
              .from('compras')
              .insert([{
                bodega_id: bodegaId,
                cajero_id: cajeroSeleccionado?.id,
                proveedor_nombre: compraCabecera.proveedor || null,
                nro_factura: compraCabecera.nroComprobante || `COMP-${Date.now().toString().slice(-6)}`,
                total: totalCompra,
                fecha_registro: new Date().toISOString()
              }])
              .select()
              .single();

            if (cErr) throw cErr;

            const detalles = compraItems.map(item => ({
              compra_id: cData.id,
              bodega_id: bodegaId,
              producto_id: item.productoId,
              cantidad: item.cantidad,
              costo_unitario: item.costoUnitario,
              subtotal: item.subtotal
            }));
            const { error: detErr } = await sbClient.from('compras_detalle').insert(detalles);
            if (detErr) throw detErr;

            // Actualizar precio de costo y sumar el stock recibido en cada
            // producto (el stock se ajusta de forma atómica por separado).
            // Si el producto no tenía seguimiento de stock (null), la propia
            // entrada de mercadería lo inicializa con lo recibido.
            for (const it of compraItems) {
              const { data: nuevoStock } = await sbClient.rpc('ajustar_stock', { p_producto_id: it.productoId, p_delta: Number(it.cantidad) });
              if (nuevoStock === null) {
                await sbClient.from('productos').update({ stock_actual: Number(it.cantidad) }).eq('id', it.productoId);
              }
              await sbClient.from('productos').update({ precio_costo: it.costoUnitario }).eq('id', it.productoId);
            }
          }

          setModalEntradaMercaderia(false);
          setCompraItems([]);
          cargarProductos();
          notificar(`¡Entrada de mercadería por S/ ${totalCompra.toFixed(2)} registrada!`, 'success');
        } catch (err) {
          notificar(`Error al registrar la entrada: ${err.message}`, 'error');
        }
      };

      // ==========================================
      // HISTORIAL DE VENTAS DEL DÍA & ANULACIÓN
      // ==========================================
      const cargarHistorialPorRango = async (desde, hasta) => {
        setCargandoHistorial(true);
        if (sbClient && bodegaId) {
          try {
            const inicio = new Date(`${desde}T00:00:00`);
            const fin = new Date(`${hasta}T23:59:59.999`);

            const { data, error } = await sbClient
              .from('ventas')
              .select('*, clientes(nombre_completo), ventas_detalle(*, productos(descripcion, unidad))')
              .eq('bodega_id', bodegaId)
              .gte('fecha_hora', inicio.toISOString())
              .lte('fecha_hora', fin.toISOString())
              .order('fecha_hora', { ascending: false });

            if (error) throw error;
            setVentasDelDia(data || []);
          } catch (err) {
            console.warn(err);
            notificar(`No se pudo cargar el historial: ${err.message}`, 'error');
          } finally {
            setCargandoHistorial(false);
          }
        } else {
          setCargandoHistorial(false);
        }
      };

      const abrirHistorialDelDia = () => {
        setModalHistorial(true);
        const hoy = fechaHoyISO();
        setFechaInicioHistorial(hoy);
        setFechaFinHistorial(hoy);
        setBusquedaBoletaHistorial('');
        cargarHistorialPorRango(hoy, hoy);
      };

      // ==========================================
      // DASHBOARD DE VENTAS (detallado, solo Administrador)
      // ==========================================
      const cargarDashboard = async (desde, hasta) => {
        setCargandoDashboard(true);
        if (sbClient && bodegaId) {
          try {
            const inicio = new Date(`${desde}T00:00:00`);
            const fin = new Date(`${hasta}T23:59:59.999`);
            const { data, error } = await sbClient
              .from('ventas')
              .select('*, ventas_detalle(*)')
              .eq('bodega_id', bodegaId)
              .gte('fecha_hora', inicio.toISOString())
              .lte('fecha_hora', fin.toISOString())
              .order('fecha_hora', { ascending: true });
            if (error) throw error;
            setVentasDashboard(data || []);

            // Deuda de clientes (crédito): es un saldo vigente, no depende del
            // rango de fechas elegido -- se muestra el estado actual siempre.
            const { data: deudores, error: errDeudores } = await sbClient
              .from('clientes')
              .select('nombre_completo, dni, saldo_actual')
              .eq('bodega_id', bodegaId)
              .gt('saldo_actual', 0)
              .order('saldo_actual', { ascending: false });
            if (errDeudores) throw errDeudores;
            setClientesDeuda(deudores || []);
          } catch (err) {
            console.warn(err);
            notificar(`No se pudo cargar el dashboard: ${err.message}`, 'error');
          } finally {
            setCargandoDashboard(false);
          }
        } else {
          setCargandoDashboard(false);
        }
      };

      const abrirDashboard = () => {
        const hoy = fechaHoyISO();
        const hace6dias = new Date();
        hace6dias.setDate(hace6dias.getDate() - 6);
        const desde = hace6dias.toISOString().slice(0, 10);
        setFechaInicioDash(desde);
        setFechaFinDash(hoy);
        setModalDashboard(true);
        cargarDashboard(desde, hoy);
      };

      // Colores consistentes por medio de pago, usados en la dona y la leyenda.
      const COLOR_MEDIO_PAGO = {
        EFECTIVO: '#f97316',
        YAPE: '#8b5cf6',
        PLIN: '#06b6d4',
        TARJETA: '#0ea5e9',
        CREDITO: '#a855f7',
        MIXTO: '#eab308',
        OTRO: '#64748b'
      };

      const construirGradienteDona = (porMedio) => {
        let acc = 0;
        const partes = porMedio.map(m => {
          const inicio = acc;
          acc += m.pct;
          const color = COLOR_MEDIO_PAGO[m.medio] || '#94a3b8';
          return `${color} ${inicio}% ${acc}%`;
        });
        return partes.length ? `conic-gradient(${partes.join(', ')})` : 'conic-gradient(#e7e5e4 0% 100%)';
      };

      const dashStats = useMemo(() => {
        const validas = ventasDashboard.filter(v => !v.anulada);
        const totalVenta = validas.reduce((a, c) => a + Number(c.total_venta), 0);
        const totalUtilidad = validas.reduce((a, c) => a + Number(c.utilidad_total || 0), 0);
        // utilidad_total ya es total_venta - costo, así que el costo sale despejando.
        const totalCosto = totalVenta - totalUtilidad;
        const numVentas = validas.length;
        const ticketPromedio = numVentas ? totalVenta / numVentas : 0;
        const margenPct = totalVenta ? (totalUtilidad / totalVenta) * 100 : 0;

        const porHora = Array.from({ length: 24 }, (_, h) => ({ hora: h, total: 0, cantidad: 0 }));
        validas.forEach(v => {
          const h = new Date(v.fecha_hora).getHours();
          porHora[h].total += Number(v.total_venta);
          porHora[h].cantidad += 1;
        });
        const maxHora = Math.max(1, ...porHora.map(h => h.total));
        const horaPico = porHora.reduce((mejor, h) => (h.total > mejor.total ? h : mejor), porHora[0]);

        const porDiaMap = {};
        validas.forEach(v => {
          const dia = v.fecha_hora.slice(0, 10);
          porDiaMap[dia] = (porDiaMap[dia] || 0) + Number(v.total_venta);
        });
        const porDia = Object.entries(porDiaMap)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([fecha, total]) => ({ fecha, total }));
        const maxDia = Math.max(1, ...porDia.map(d => d.total));

        const porMedioMap = {};
        validas.forEach(v => {
          const medio = v.medio_pago || 'OTRO';
          porMedioMap[medio] = (porMedioMap[medio] || 0) + Number(v.total_venta);
        });
        const porMedio = Object.entries(porMedioMap)
          .map(([medio, total]) => ({ medio, total, pct: totalVenta ? (total / totalVenta) * 100 : 0 }))
          .sort((a, b) => b.total - a.total);

        const prodMap = {};
        validas.forEach(v => {
          (v.ventas_detalle || []).forEach(d => {
            const key = d.descripcion || 'Producto';
            if (!prodMap[key]) prodMap[key] = { descripcion: key, cantidad: 0, monto: 0, utilidad: 0 };
            prodMap[key].cantidad += Number(d.cantidad);
            prodMap[key].monto += Number(d.subtotal);
            prodMap[key].utilidad += Number(d.utilidad || 0);
          });
        });
        const topProductos = Object.values(prodMap).sort((a, b) => b.monto - a.monto).slice(0, 8);
        const maxProducto = Math.max(1, ...topProductos.map(p => p.monto));

        const numDeudores = clientesDeuda.length;
        const totalDeuda = clientesDeuda.reduce((a, c) => a + Number(c.saldo_actual || 0), 0);
        const maxDeuda = Math.max(1, ...clientesDeuda.map(c => Number(c.saldo_actual || 0)));

        return { totalVenta, totalUtilidad, totalCosto, numVentas, ticketPromedio, margenPct, porHora, maxHora, horaPico, porDia, maxDia, porMedio, topProductos, maxProducto, numDeudores, totalDeuda, maxDeuda };
      }, [ventasDashboard, clientesDeuda]);

      const exportarVentasExcel = () => {
        const filas = ventasDelDia.map((v) => ({
          Boleta: v.nro_boleta,
          Fecha: new Date(v.fecha_hora).toLocaleString('es-PE'),
          Cliente: v.clientes?.nombre_completo || 'Desconocido',
          'Medio de Pago': v.medio_pago,
          Total: Number(v.total_venta),
          Utilidad: Number(v.utilidad_total || 0),
          Estado: v.anulada ? 'Anulada' : 'Válida'
        }));
        exportarExcel(`Ventas_${fechaInicioHistorial}_a_${fechaFinHistorial}.xlsx`, filas, 'Ventas');
      };

      const anularVentaHoy = async (venta) => {
        if (venta.anulada) return;
        const ok = await pedirConfirmacion({
          titulo: 'Anular boleta',
          mensaje: `¿Estás seguro de ANULAR la boleta ${venta.nro_boleta}? Esta acción no se puede deshacer.`,
          textoBoton: 'Sí, anular',
          peligroso: true
        });
        if (!ok) return;

        const motivoIngresado = await pedirTexto({
          titulo: 'Motivo de la anulación',
          mensaje: 'Opcional.',
          placeholder: 'Ej: Cliente se arrepintió',
          textoBoton: 'Anular boleta'
        });
        const motivo = (motivoIngresado || '').trim() || 'Sin motivo especificado';

        try {
          if (sbClient) {
            // Si la venta era a crédito, revertir la deuda del cliente antes de anular
            if (venta.medio_pago === 'CREDITO' && venta.cliente_id) {
              const { data: cli } = await sbClient
                .from('clientes')
                .select('saldo_actual')
                .eq('id', venta.cliente_id)
                .single();
              if (cli) {
                const nuevoSaldo = Math.max(0, +(Number(cli.saldo_actual) - Number(venta.total_venta)).toFixed(2));
                const { error: errSaldo } = await sbClient.from('clientes').update({ saldo_actual: nuevoSaldo }).eq('id', venta.cliente_id);
                if (errSaldo) throw new Error(`No se pudo revertir la deuda del cliente: ${errSaldo.message}`);
              }
            }

            // Soft-delete: se marca como anulada en vez de borrarla, para conservar el historial
            const { error: errAnular } = await sbClient
              .from('ventas')
              .update({ anulada: true, motivo_anulacion: motivo })
              .eq('id', venta.id);
            if (errAnular) throw errAnular;

            // Reponer el stock de los productos de esta venta (ajuste atómico)
            for (const d of (venta.ventas_detalle || [])) {
              if (d.producto_id) {
                await sbClient.rpc('ajustar_stock', { p_producto_id: d.producto_id, p_delta: Number(d.cantidad) });
              }
            }
          }
          setVentasDelDia(prev => prev.map(v => v.id === venta.id ? { ...v, anulada: true, motivo_anulacion: motivo } : v));
          cargarProductos(busqueda); // refresca el stock repuesto en el catálogo
          notificar(`Boleta ${venta.nro_boleta} anulada correctamente.`, 'info');
        } catch (err) {
          notificar(`Error al anular: ${err.message}`, 'error');
        }
      };

      // ==========================================
      // ARQUEO Y CIERRE DE CAJA
      // ==========================================
      const handleCierreConArqueo = async () => {
        if (!turnoActivo) return;
        const montoReal = parseFloat(montoConteoEfectivo) || 0;
        const montoIni = Number(turnoActivo.monto_inicial) || 0;

        // Calcular efectivo real del turno: ventas 100% en efectivo +
        // la parte en efectivo de las ventas Mixtas (ese dinero también
        // entra físicamente a la caja).
        let ventasEfectivo = 0;
        if (sbClient) {
          const { data: vts } = await sbClient
            .from('ventas')
            .select('total_venta, medio_pago, monto_efectivo')
            .eq('turno_caja_id', turnoActivo.id)
            .in('medio_pago', ['EFECTIVO', 'MIXTO']);

          ventasEfectivo = (vts || []).reduce((acc, v) => {
            const efectivo = v.medio_pago === 'EFECTIVO' ? Number(v.total_venta) : Number(v.monto_efectivo) || 0;
            return acc + efectivo;
          }, 0);
        }

        const esperado = +(montoIni + ventasEfectivo).toFixed(2);
        const dif = +(montoReal - esperado).toFixed(2);

        if (sbClient) {
          try {
            const { error } = await sbClient
              .from('turnos_caja')
              .update({
                fecha_cierre: new Date().toISOString(),
                monto_final_real: montoReal,
                ventas_sistema: ventasEfectivo,
                diferencia: dif,
                estado: 'CERRADA'
              })
              .eq('id', turnoActivo.id);
            if (error) {
              console.warn('Error al cerrar el turno en la base de datos:', error);
              notificar(`El cierre se calculó bien, pero no se guardó en el servidor (${error.message}). Avisa al soporte.`, 'error');
            }
          } catch (err) {
            console.error(err);
          }
        }

        setResumenCierre({
          inicio: montoIni,
          ventas: ventasEfectivo,
          esperado,
          real: montoReal,
          diferencia: dif
        });

        setModalCierreCaja(false);
        setTurnoActivo(null);
        setMontoConteoEfectivo('');
      };

      // Turno activo check
      const verificarTurno = async () => {
        if (!sbClient || !bodegaId) return;
        try {
          // Un turno se considera abierto si su estado lo indica O si aún no tiene
          // fecha_cierre (indicador más confiable, no depende de qué texto haya
          // quedado guardado en `estado`).
          const { data } = await sbClient
            .from('turnos_caja')
            .select('*')
            .eq('bodega_id', bodegaId)
            .or('estado.ilike.%abierto%,estado.ilike.%open%,estado.ilike.%activo%,fecha_cierre.is.null')
            .order('fecha_apertura', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (data) setTurnoActivo(data);
        } catch (err) {
          console.warn(err);
        }
      };

      // Abrir turno
      const handleAbrirTurno = async () => {
        const monto = parseFloat(montoApertura) || 0;
        const cajeroFinal = cajeroSeleccionado || listaCajeros[0];

        if (!cajeroFinal || !cajeroFinal.id) {
          notificar('Selecciona un cajero.', 'error');
          return;
        }

        if (sbClient) {
          try {
            let { data, error } = await sbClient
              .from('turnos_caja')
              .insert([{
                bodega_id: bodegaId,
                cajero_id: cajeroFinal.id,
                monto_inicial: monto,
                fecha_apertura: new Date().toISOString(),
                ventas_sistema: 0.00,
                estado: 'ABIERTA'
              }])
              .select()
              .single();

            if (data) {
              setTurnoActivo(data);
              setModalTurno(false);
              notificar(`Turno abierto con: ${cajeroFinal.nombre}`, 'success');
              return;
            }

            // Si falló por una razón real (no por estar en modo demo sin
            // bodega válida en la BD), se avisa en vez de fallar en
            // silencio y seguir como si nada -- así este tipo de error no
            // vuelve a pasar desapercibido.
            if (error && bodegaId !== BODEGA_DEMO_ID) {
              console.warn('Error al abrir turno en la base de datos:', error);
              notificar(`No se pudo abrir el turno en el servidor (${error.message}). Se abrió localmente; avisa al soporte.`, 'error');
            } else {
              notificar('Turno abierto.', 'info');
            }
          } catch (err) {
            console.warn(err);
          }
        }

        setTurnoActivo({ id: generarUUID(), bodega_id: bodegaId, cajero_id: cajeroFinal.id, monto_inicial: monto, estado: 'ABIERTA', fecha_apertura: new Date().toISOString() });
        setModalTurno(false);
      };

      // Cobrar venta
      const handleCobrar = async () => {
        if (carrito.length === 0) {
          notificar('El carrito está vacío.', 'error');
          return;
        }
        if (medioPago === 'EFECTIVO' && montoRecibido && parseFloat(montoRecibido) < totalConDescuento) {
          notificar('Monto recibido insuficiente.', 'error');
          return;
        }

        // Validación de crédito: Saldo actual + Venta <= Límite
        if (medioPago === 'CREDITO') {
          if (!clienteActual || clienteActual.dni === '99999999') {
            notificar('Para vender a crédito debes seleccionar un cliente registrado.', 'error');
            setModalNuevoCliente(true);
            return;
          }
          const limiteCred = Number(clienteActual.limite_credito) || 0;
          const saldoAct = Number(clienteActual.saldo_actual) || 0;
          const nuevoSaldoProyectado = +(saldoAct + totalConDescuento).toFixed(2);
          if (nuevoSaldoProyectado > limiteCred) {
            const disponible = Math.max(0, +(limiteCred - saldoAct).toFixed(2));
            notificar(`Límite de crédito excedido. Disponible: S/ ${disponible.toFixed(2)} de S/ ${limiteCred.toFixed(2)}.`, 'error');
            return;
          }
        }

        // Validación de pago mixto: el efectivo entregado debe alcanzar para cubrir
        // lo que no se pagó con tarjeta/otro (el vuelto se calcula, no se exige exacto).
        let montoEfectivoMixto = 0;
        let montoOtroMixto = 0;
        if (medioPago === 'MIXTO') {
          montoOtroMixto = Math.min(parseFloat(montoMixtoOtro) || 0, totalConDescuento);
          montoEfectivoMixto = efectivoRequeridoMixto;
          const recibidoMixto = parseFloat(montoMixtoRecibido) || 0;
          if (montoEfectivoMixto > 0 && recibidoMixto < montoEfectivoMixto) {
            notificar(`Falta efectivo: debes recibir al menos S/ ${montoEfectivoMixto.toFixed(2)} en efectivo.`, 'error');
            return;
          }
        }

        setProcesandoVenta(true);
        const correlativo = `B001-${String(Date.now()).slice(-8)}`;

        try {
          if (sbClient) {
            const idTurnoReal = turnoActivo?.id;
            const cajeroFinal = cajeroSeleccionado || listaCajeros[0];

            let idClienteReal = clienteActual?.id;
            const utilidadBruta = carrito.reduce((acc, item) => {
              const costoTotal = (Number(item.precioCosto) || 0) * Number(item.cantidad);
              return acc + (Number(item.subtotal) - costoTotal);
            }, 0);
            // El descuento sale directo de la ganancia: la utilidad real de la
            // venta es la bruta menos lo que se rebajó.
            const utilidadTotal = utilidadBruta - montoDescuento;
            const payloadVenta = {
              bodega_id: bodegaId,
              turno_caja_id: idTurnoReal || null,
              cajero_id: cajeroFinal?.id,
              cliente_id: idClienteReal || null,
              nro_boleta: correlativo,
              medio_pago: medioPago,
              total_venta: totalConDescuento,
              descuento_monto: montoDescuento,
              utilidad_total: +utilidadTotal.toFixed(2),
              monto_efectivo: medioPago === 'MIXTO' ? montoEfectivoMixto : 0,
              monto_otro: medioPago === 'MIXTO' ? montoOtroMixto : 0
            };

            const { data: vCreada, error: vErr } = await sbClient
              .from('ventas')
              .insert([payloadVenta])
              .select()
              .single();

            if (vErr) throw vErr;

            const payloadDetalles = carrito.map(item => {
              const costoTotal = (Number(item.precioCosto) || 0) * Number(item.cantidad);
              return {
                bodega_id: bodegaId,
                venta_id: vCreada.id,
                producto_id: typeof item.productoId === 'string' && item.productoId.length > 10 ? item.productoId : null,
                cod_ean: item.cod_ean || '',
                descripcion: item.descripcion || '',
                cantidad: Number(item.cantidad),
                precio_unitario: Number(item.precioUnitario),
                precio_costo: Number(item.precioCosto) || 0,
                subtotal: Number(item.subtotal),
                utilidad: +(Number(item.subtotal) - costoTotal).toFixed(2)
              };
            });

            const { error: detErr } = await sbClient.from('ventas_detalle').insert(payloadDetalles);
            if (detErr) {
              console.error('Error al guardar el detalle de la venta:', detErr);
              notificar(`Venta registrada, pero el detalle de productos no se guardó: ${detErr.message}`, 'error');
            }

            // Si es crédito, actualizar saldo
            if (medioPago === 'CREDITO' && idClienteReal) {
              const saldoAct = Number(clienteActual.saldo_actual) || 0;
              const { error: errSaldoCredito } = await sbClient
                .from('clientes')
                .update({ saldo_actual: +(saldoAct + totalConDescuento).toFixed(2) })
                .eq('id', idClienteReal);
              if (errSaldoCredito) {
                console.warn('Error al actualizar la deuda del cliente:', errSaldoCredito);
                notificar(`Venta registrada, pero no se pudo actualizar la deuda del cliente (${errSaldoCredito.message}). Avisa al soporte.`, 'error');
              }
            }

            // Descontar el stock vendido de cada producto real (no de catálogo de demo).
            // Se usa la función ajustar_stock (ajuste atómico en la base de
            // datos) en vez de leer y luego escribir desde aquí, para que
            // dos cajeros vendiendo el mismo producto a la vez no se pisen.
            for (const item of carrito) {
              if (typeof item.productoId === 'string' && item.productoId.length > 10) {
                await sbClient.rpc('ajustar_stock', { p_producto_id: item.productoId, p_delta: -Number(item.cantidad) });
              }
            }
          }

          const resultado = {
            nro_boleta: correlativo,
            medio_pago: medioPago,
            total_venta: totalConDescuento,
            subtotal: totalVenta,
            descuento: montoDescuento,
            items: [...carrito],
            cliente: clienteActual?.nombre_completo || 'Desconocido',
            cajero: cajeroSeleccionado?.nombre || usuarioActivo?.nombre || 'Cajero',
            fecha: new Date().toLocaleTimeString()
          };

          setVentaCompletada(resultado);
          setCarrito([]);
          setDescuentoTipo(null);
          setDescuentoValor('');
          setMontoRecibido('');
          setMontoMixtoOtro('');
          setMontoMixtoRecibido('');
          setCampoTeclado(null);
          setMostrarPago(false);
          setMedioPago('EFECTIVO');
          // Vuelve al cliente genérico para la siguiente venta (evita dejar
          // seleccionado por accidente al mismo cliente de la venta a crédito).
          setDniCliente('99999999');
          obtenerOCrearCliente('99999999');
          cargarProductos(busqueda); // refresca el stock mostrado en el catálogo
          notificar(`¡Venta completada! Boleta: ${correlativo}`, 'success');
        } catch (err) {
          notificar(`Error al registrar venta: ${err.message}`, 'error');
        } finally {
          setProcesandoVenta(false);
        }
      };

      // =========================================================================
      // VISTA 1: AUTH (LOGIN / REGISTRO)
      // =========================================================================
      if (verificandoSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-stone-50">
            <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      if (!sesion) {
        return (
          <div className="min-h-screen bg-orange-600 md:bg-stone-50 flex flex-col md:flex-row select-none">
            {toast.visible && (
              <div className={`fixed top-6 inset-x-4 md:inset-x-auto md:right-6 md:max-w-xs z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl border-l-4 bg-white text-xs font-semibold ${toast.tipo === 'error' ? 'border-rose-500 text-rose-700' : 'border-emerald-500 text-emerald-700'}`}>
                <i className={`fa-solid ${toast.tipo === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-sm shrink-0`}></i>
                {toast.texto}
              </div>
            )}

            {/* Panel de marca */}
            <div className="relative overflow-hidden bg-gradient-to-br from-orange-600 via-orange-500 to-amber-500 md:w-1/2 md:min-h-screen flex flex-col items-center justify-center px-6 pt-14 pb-10 md:py-16 text-white shrink-0">
              <div className="absolute -top-10 -left-10 w-40 h-40 bg-white/10 rounded-full"></div>
              <div className="absolute bottom-6 -right-14 w-56 h-56 bg-white/10 rounded-full"></div>
              <div className="absolute top-1/3 right-8 w-16 h-16 bg-white/10 rounded-full hidden md:block"></div>
              <div className="relative inline-flex items-center justify-center w-20 h-20 bg-amber-300 rounded-full shadow-lg text-orange-700 text-4xl mb-5">
                <i className="fa-solid fa-store"></i>
              </div>
              <h1 className="relative text-3xl font-black tracking-tight">Kaserita</h1>
              <p className="relative text-sm text-orange-50/90 mt-1 text-center max-w-[220px]">Punto de Venta para tu Bodega o Negocio</p>
            </div>

            {/* Tarjeta de formulario */}
            <div className="relative flex-1 md:w-1/2 flex md:items-center justify-center md:px-5">
              <div className="w-full md:max-w-md flex-1 md:flex-none bg-white rounded-t-[2.5rem] md:rounded-3xl shadow-2xl px-7 pt-9 pb-10 md:p-10 space-y-6">
                <div className="text-center space-y-1">
                  <h2 className="text-xl font-black text-stone-900">{authTab === 'login' ? '¡Bienvenido de nuevo!' : 'Crea tu Bodega'}</h2>
                  <p className="text-xs text-stone-500">{authTab === 'login' ? 'Ingresa tus datos para continuar' : 'Regístrate para empezar a vender'}</p>
                </div>

                <div className="flex bg-stone-100 p-1 rounded-xl border border-stone-200">
                  <button
                    type="button"
                    onClick={() => setAuthTab('login')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authTab === 'login' ? 'bg-orange-600 text-white shadow-md' : 'text-stone-600 hover:text-stone-800'}`}
                  >
                    Iniciar Sesión
                  </button>
                  <button
                    type="button"
                    onClick={() => setAuthTab('register')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authTab === 'register' ? 'bg-orange-600 text-white shadow-md' : 'text-stone-600 hover:text-stone-800'}`}
                  >
                    Crear Bodega
                  </button>
                </div>

                {authTab === 'login' && (
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  setCargandoAuth(true);
                  try {
                    const dni = formLogin.dni.trim();
                    const pin = formLogin.pin.trim();
                    const email = emailAuthDesdeDni(dni);
                    const password = passwordAuthDesdePin(pin);

                    const { error: errSignIn } = await sbClient.auth.signInWithPassword({ email, password });

                    if (errSignIn) {
                      console.warn('[login] signIn falló:', errSignIn.status, errSignIn.message);
                      // Puede ser una cuenta que todavía no se migró al nuevo
                      // sistema de acceso (bodega creada antes de este cambio):
                      // se crea su cuenta real y, si el DNI+PIN coincide con lo
                      // que ya tenía guardado, se vincula automáticamente.
                      const { error: errSignUp } = await sbClient.auth.signUp({ email, password });
                      if (errSignUp) {
                        console.warn('[login] signUp falló:', errSignUp.status, errSignUp.message);
                        throw new Error('DNI o PIN incorrecto.');
                      }

                      const { data: bodegaReclamada, error: errReclamo } = await sbClient.rpc('reclamar_cuenta_bodega', { p_dni: dni, p_pin: pin });
                      if (errReclamo || !bodegaReclamada) {
                        console.warn('[login] reclamo falló:', errReclamo?.message, 'bodegaReclamada:', bodegaReclamada);
                        await sbClient.auth.signOut();
                        throw new Error('DNI o PIN incorrecto.');
                      }
                    }

                    const { data: { user } } = await sbClient.auth.getUser();
                    const { data: usuario, error: errUsuario } = await sbClient.from('usuarios').select('*').eq('auth_id', user.id).single();
                    if (errUsuario || !usuario) throw new Error('No se pudo cargar tu cuenta. Intenta de nuevo.');
                    const { data: bodega } = await sbClient.from('bodegas').select('*').eq('id', usuario.bodega_id).single();
                    guardarSesion({ usuario, bodega: bodega || { id: usuario.bodega_id, nombre: 'Mi Bodega' } });
                    notificar(`¡Bienvenido ${usuario.nombre}!`, 'success');
                  } catch (err) {
                    notificar(err.message, 'error');
                  } finally {
                    setCargandoAuth(false);
                  }
                }} className="space-y-5">
                  <div>
                    <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">DNI del Usuario</label>

                      type="text"
                      required
                      maxLength={8}
                      placeholder="8 dígitos"
                      value={formLogin.dni}
                      onChange={(e) => setFormLogin({ ...formLogin, dni: e.target.value })}
                      className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 transition"

                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">PIN de Acceso</label>
                    <input
                      type="password"
                      required
                      maxLength={6}
                      placeholder="••••"
                      value={formLogin.pin}
                      onChange={(e) => setFormLogin({ ...formLogin, pin: e.target.value })}
                      className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 tracking-widest transition"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={cargandoAuth}
                    className="w-full py-3.5 bg-orange-600 hover:bg-orange-500 text-white font-black text-sm uppercase rounded-full transition shadow-lg shadow-orange-500/30 disabled:opacity-50"
                  >
                    {cargandoAuth ? 'Verificando...' : 'Ingresar'}
                  </button>
                </form>
              )}

              {authTab === 'register' && (
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  setCargandoAuth(true);
                  try {
                    const dni = formRegistro.dni.trim();
                    const pin = formRegistro.pin.trim();
                    const email = emailAuthDesdeDni(dni);
                    const password = passwordAuthDesdePin(pin);

                    const { data: authData, error: errAuth } = await sbClient.auth.signUp({ email, password });
                    if (errAuth) throw new Error(errAuth.message.includes('registered') ? 'Ese DNI ya tiene una cuenta registrada. Inicia sesión en vez de crear una bodega nueva.' : errAuth.message);
                    if (!authData?.user) throw new Error('No se pudo crear la cuenta. Intenta de nuevo.');

                    const { data: bCreada, error: errBodega } = await sbClient.from('bodegas').insert([{ nombre: formRegistro.nombreBodega.trim() }]).select().single();
                    if (errBodega) throw errBodega;

                    const { data: uCreado, error: errUsuario } = await sbClient.from('usuarios').insert([{ bodega_id: bCreada.id, nombre: formRegistro.nombreDueno.trim(), dni, pin_acceso: pin, rol: 'dueno', activo: true, auth_id: authData.user.id }]).select().single();
                    if (errUsuario) throw errUsuario;

                    const { error: errCajero } = await sbClient.from('cajeros').insert([{ bodega_id: bCreada.id, nombre: formRegistro.nombreDueno.trim(), dni, rol: 'dueno', activo: true }]);
                    if (errCajero) throw errCajero;

                    const { error: errCliente } = await sbClient.from('clientes').insert([{ bodega_id: bCreada.id, dni: '99999999', nombre_completo: 'Desconocido', saldo_actual: 0 }]);
                    if (errCliente) throw errCliente;

                    guardarSesion({ usuario: uCreado, bodega: bCreada });
                    notificar(`¡Bodega creada con éxito! Ahora registra tu inventario.`, 'success');
                    // Como bodega nueva no tiene productos aún, se lleva directo a
                    // cargar el inventario inicial en vez de sembrar datos de ejemplo
                    // que no corresponden al negocio real del dueño.
                    setModalInventarioInicial(true);
                  } catch (err) {
                    notificar(err.message, 'error');
                  } finally {
                    setCargandoAuth(false);
                  }
                }} className="space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">Nombre de Bodega</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Bodega Don Pepe"
                      value={formRegistro.nombreBodega}
                      onChange={(e) => setFormRegistro({ ...formRegistro, nombreBodega: e.target.value })}
                      className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 transition"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">Dueño</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Juan Pérez"
                      value={formRegistro.nombreDueno}
                      onChange={(e) => setFormRegistro({ ...formRegistro, nombreDueno: e.target.value })}
                      className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 transition"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">DNI</label>
                      <input
                        type="text"
                        required
                        maxLength={8}
                        value={formRegistro.dni}
                        onChange={(e) => setFormRegistro({ ...formRegistro, dni: e.target.value })}
                        className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 transition"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-stone-400 uppercase tracking-wide">PIN</label>
                      <input
                        type="password"
                        required
                        maxLength={6}
                        value={formRegistro.pin}
                        onChange={(e) => setFormRegistro({ ...formRegistro, pin: e.target.value })}
                        className="w-full bg-transparent border-b-2 border-stone-200 focus:border-orange-500 outline-none py-2 text-sm text-stone-900 tracking-widest transition"
                      />
                    </div>
                  </div>
                  <button
                    type="submit"
                    disabled={cargandoAuth}
                    className="w-full py-3.5 bg-orange-600 hover:bg-orange-500 text-white font-black text-sm uppercase rounded-full transition shadow-lg shadow-orange-500/30 disabled:opacity-50"
                  >
                    🚀 Crear Bodega y Entrar
                  </button>
                </form>
              )}

              <div className="pt-2 border-t border-stone-100 flex items-center justify-center text-xs">
                <button type="button" onClick={() => {
                  const demoU = { id: 'c0000000-0000-0000-0000-000000000001', bodega_id: BODEGA_DEMO_ID, nombre: 'Dueño Demo', dni: '12345678', rol: 'dueno', activo: true };
                  setListaCajeros([demoU]);
                  setCajeroSeleccionado(demoU);
                  guardarSesion({ usuario: demoU, bodega: { id: BODEGA_DEMO_ID, nombre: 'Bodega Demo' } });
                }} className="text-stone-500 hover:text-orange-600 font-semibold">
                  ⚡ Modo Demo Local
                </button>
              </div>
              </div>
            </div>
          </div>
        );
      }

      // =========================================================================
      // VISTA 2: POS INTERFACE COMPLETO
      // =========================================================================
      return (
        <div className="flex h-screen bg-stone-50 text-stone-900 font-sans select-none overflow-hidden">
          {/* Toast */}
          {toast.visible && (
            <div className={`fixed top-[4.75rem] inset-x-4 md:top-4 md:inset-x-auto md:right-4 md:max-w-xs z-[100] pointer-events-none flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl border-l-4 bg-white text-xs font-semibold ${toast.tipo === 'error' ? 'border-rose-500 text-rose-700' : 'border-emerald-500 text-emerald-700'}`}>
              <i className={`fa-solid ${toast.tipo === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-sm shrink-0`}></i>
              {toast.texto}
            </div>
          )}

          {/* Sidebar de navegación (solo desktop) */}
          <aside className="hidden md:flex flex-col items-center w-24 bg-stone-100 border-r border-stone-200/80 py-3 gap-0.5 shrink-0 overflow-y-auto">
            <div className="w-11 h-11 bg-gradient-to-br from-orange-400 to-orange-600 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-orange-500/25 mb-3 shrink-0">
              K
            </div>
            <SidebarIcon icon="fa-grip" label="Catálogo" texto="Vender" active onClick={() => setMostrarResumenMobile(false)} />
            <SidebarIcon icon="fa-clock-rotate-left" label="Ventas en Espera" texto="En Espera" badge={ventasEnEspera.length} onClick={() => setModalVentasEspera(true)} />
            <SidebarIcon icon="fa-receipt" label="Historial de Ventas" texto="Historial" onClick={abrirHistorialDelDia} />
            <SidebarIcon icon="fa-hand-holding-dollar" label="Cuentas por Cobrar" texto="Cobrar Deuda" onClick={abrirModuloCobroDeudas} />
            <SidebarIcon icon="fa-user-plus" label="Nuevo Cliente" texto="Nuevo Cliente" onClick={() => setModalNuevoCliente(true)} />
            <SidebarIcon icon="fa-triangle-exclamation" label="Stock Bajo" texto="Stock Bajo" badge={cantidadStockBajo} tone={cantidadStockBajo > 0 ? 'orange' : 'default'} onClick={() => setModalStockBajo(true)} />
            <SidebarIcon icon="fa-box" label="Registrar Merma" texto="Merma" onClick={() => setModalMerma(true)} />
            {esAdmin && (
              <>
                <div className="w-10 h-px bg-stone-200 my-2 shrink-0"></div>
                <SidebarIcon icon="fa-chart-pie" label="Dashboard de Ventas" texto="Dashboard" onClick={abrirDashboard} />
                <SidebarIcon icon="fa-boxes-stacked" label="Registrar Inventario" texto="Inventario" onClick={() => setModalInventarioInicial(true)} />
                <SidebarIcon icon="fa-truck-ramp-box" label="Entrada de Mercadería" texto="Mercadería" onClick={() => setModalEntradaMercaderia(true)} />
                <SidebarIcon icon="fa-box-open" label="Nuevo Producto" texto="Producto" onClick={() => setModalNuevoProducto(true)} />
                <SidebarIcon icon="fa-users" label="Clientes (editar)" texto="Clientes" onClick={abrirGestionClientes} />
                <SidebarIcon icon="fa-user-group" label="Cajeros y Empleados" texto="Cajeros" onClick={abrirGestionCajeros} />
              </>
            )}
            <div className="flex-1 min-h-2"></div>
            {turnoActivo ? (
              <SidebarIcon icon="fa-lock" label="Cerrar Caja" texto="Cerrar Caja" tone="rose" onClick={() => setModalCierreCaja(true)} />
            ) : (
              <SidebarIcon icon="fa-lock-open" label="Abrir Turno" texto="Abrir Turno" tone="orange" onClick={() => setModalTurno(true)} />
            )}
            <SidebarIcon icon="fa-right-from-bracket" label="Cerrar Sesión" texto="Salir" onClick={cerrarSesion} />
          </aside>

          {/* Columna Central: Catálogo (Order Line) */}
          <div className="flex-1 flex flex-col overflow-hidden">
            <header className="flex items-center justify-between px-4 md:px-6 py-3.5 bg-stone-100 border-b border-stone-200/80 gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="md:hidden w-9 h-9 bg-gradient-to-br from-orange-400 to-orange-600 rounded-xl flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-orange-500/25 shrink-0">
                  K
                </div>
                <div className="min-w-0">

                  <p className="text-xs text-stone-500 truncate flex items-center gap-1.5">

                    {cajeroSeleccionado?.nombre || usuarioActivo?.nombre}

              <div className="flex items-center gap-2 shrink-0">
                {turnoActivo ? (
                  <button
                    onClick={() => setModalCierreCaja(true)}
                    className="hidden sm:inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-orange-500/10 text-orange-600 border border-orange-500/25 hover:bg-orange-500/20 transition"
                  >
                    <span className="w-1.5 h-1.5 rounded-full bg-orange-400 animate-pulse"></span> Turno Abierto
                  </button>

                  <button
                    onClick={() => setModalTurno(true)}

                <button

                >
                  <i className="fa-solid fa-ellipsis"></i>
                </button>

            <div className="flex-1 flex flex-col overflow-hidden p-3 md:p-4 gap-3">
              {/* Buscador */}

                    autoFocus

                          onChange={(e) => actualizarFilaInventario(idx, 'stock_actual', e.target.value)}
                          className={claseCampoNormal}

                          value={fila.unidad}
                          disabled={esExistente}
                          onChange={(e) => actualizarFilaInventario(idx, 'unidad', e.target.value)}
                          className={esExistente ? claseCampoVinculado : claseCampoNormal}

            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-[100] p-4">
              <div className="bg-stone-100 border border-stone-200 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3">
                <h3 className="text-base font-bold text-stone-900">{modalPrompt.titulo}</h3>
                {modalPrompt.mensaje && <p className="text-xs text-stone-600">{modalPrompt.mensaje}</p>}
                <input
                  type="text"
                  autoFocus
                  value={modalPromptValor}
                  onChange={(e) => setModalPromptValor(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') { modalPrompt.onConfirmar(modalPromptValor); setModalPrompt(null); }
                  }}
                  placeholder={modalPrompt.placeholder}
                  className="w-full bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm text-stone-900 focus:outline-none focus:border-orange-500"
                />
                <div className="flex gap-2">
                  <button
                    onClick={() => { modalPrompt.onCancelar(); setModalPrompt(null); }}
                    className="flex-1 py-2.5 bg-stone-200 hover:bg-stone-300 text-stone-800 font-semibold text-xs rounded-xl"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={() => { modalPrompt.onConfirmar(modalPromptValor); setModalPrompt(null); }}
                    className="flex-1 py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl shadow"
                  >
                    {modalPrompt.textoBoton}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal genérico: reemplazo de confirm() nativo */}
          {modalConfirmar && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-[100] p-4">
              <div className="bg-stone-100 border border-stone-200 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3">
                <h3 className="text-base font-bold text-stone-900">{modalConfirmar.titulo}</h3>
                <p className="text-xs text-stone-600">{modalConfirmar.mensaje}</p>
                <div className="flex gap-2">
                  <button
                    onClick={() => { modalConfirmar.onCancelar(); setModalConfirmar(null); }}
                    className="flex-1 py-2.5 bg-stone-200 hover:bg-stone-300 text-stone-800 font-semibold text-xs rounded-xl"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={() => { modalConfirmar.onConfirmar(); setModalConfirmar(null); }}
                    className={`flex-1 py-2.5 text-white font-bold text-xs rounded-xl shadow ${modalConfirmar.peligroso ? 'bg-rose-600 hover:bg-rose-500' : 'bg-orange-600 hover:bg-orange-500'}`}
                  >
                    {modalConfirmar.textoBoton}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PosApp />);
  </script>
</body>
</html>
