                <div className="flex justify-between items-center pt-2 border-t border-stone-800">
                  <span className="font-bold text-sm">Total Compra:</span>
                  <span className="font-black text-lg text-orange-400">
                    S/ {compraItems.reduce((a, c) => a + c.subtotal, 0).toFixed(2)}
                  </span>
                </div>

                <button onClick={guardarEntradaMercaderia} className="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl shadow">
                  Confirmar Entrada de Mercadería
                </button>
              </div>
            </div>
          )}

          {/* Modal: Cobrar Deudas / Créditos */}
          {modalCobrarDeudas && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">💳 Cuentas por Cobrar (Deudas)</h3>
                  <button onClick={() => setModalCobrarDeudas(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>

                {deudorSeleccionado ? (
                  <div className="p-3 bg-stone-950 rounded-xl border border-amber-500/50 space-y-3">
                    <div className="flex justify-between">
                      <span className="font-bold text-xs text-white">👤 {deudorSeleccionado.nombre_completo}</span>
                      <button onClick={() => setDeudorSeleccionado(null)} className="text-[11px] text-stone-400 underline">Cambiar</button>
                    </div>
                    <div className="text-xs">
                      <p>DNI: {deudorSeleccionado.dni}</p>
                      <p className="text-rose-400 font-bold mt-1 text-sm">Deuda Actual: S/ {Number(deudorSeleccionado.saldo_actual).toFixed(2)}</p>
                    </div>
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Monto a Abonar (S/):</label>
                      <input
                        type="number"
                        step="1.00"
                        placeholder="0.00"
                        value={montoAbonoDeuda}
                        onChange={(e) => setMontoAbonoDeuda(e.target.value)}
                        className="w-full bg-stone-900 border border-stone-800 rounded-lg p-2 text-sm font-bold text-white focus:outline-none focus:border-orange-500"
                      />
                    </div>
                    <button onClick={procesarPagoDeudaCliente} className="w-full py-2 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl shadow">
                      ✓ Registrar Pago de Deuda
                    </button>
                  </div>
                ) : (
                  <div className="max-h-60 overflow-y-auto space-y-1.5">
                    {clientesDeudores.length === 0 ? (
                      <p className="text-xs text-stone-400 text-center py-6">¡No hay clientes con deuda pendiente!</p>
                    ) : (
                      clientesDeudores.map(cl => (
                        <div
                          key={cl.id}
                          onClick={() => { setDeudorSeleccionado(cl); setMontoAbonoDeuda(String(cl.saldo_actual)); }}
                          className="flex justify-between items-center p-2.5 bg-stone-950 hover:bg-stone-800 border border-stone-800 rounded-xl cursor-pointer transition"
                        >
                          <div>
                            <p className="text-xs font-bold text-stone-200">{cl.nombre_completo}</p>
                            <p className="text-[10px] text-stone-400">DNI: {cl.dni}</p>
                          </div>
                          <span className="text-sm font-black text-rose-400">S/ {Number(cl.saldo_actual).toFixed(2)}</span>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal: Nuevo Cliente con Límite de Crédito */}
          {modalNuevoCliente && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">👤 Registrar Nuevo Cliente</h3>
                  <button onClick={() => setModalNuevoCliente(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleGuardarNuevoCliente} className="space-y-2.5">
                  <div>
                    <label className="text-[11px] text-stone-400 block mb-1">DNI *</label>
                    <input
                      type="text"
                      required
                      value={formCliente.dni}
                      onChange={(e) => setFormCliente({ ...formCliente, dni: e.target.value })}
                      className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-stone-400 block mb-1">Nombre Completo *</label>
                    <input
                      type="text"
                      required
                      value={formCliente.nombre}
                      onChange={(e) => setFormCliente({ ...formCliente, nombre: e.target.value })}
                      className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Teléfono</label>
                      <input
                        type="text"
                        value={formCliente.telefono}
                        onChange={(e) => setFormCliente({ ...formCliente, telefono: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-stone-400 block mb-1">Correo</label>
                      <input
                        type="text"
                        value={formCliente.correo}
                        onChange={(e) => setFormCliente({ ...formCliente, correo: e.target.value })}
                        className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-stone-400 block mb-1">Límite de Crédito (S/) *</label>
                    <input
                      type="number"
                      step="10"
                      required
                      value={formCliente.limiteCredito}
                      onChange={(e) => setFormCliente({ ...formCliente, limiteCredito: e.target.value })}
                      className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-1.5 text-sm font-bold text-orange-400"
                    />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl shadow mt-2">
                    Guardar Cliente
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Historial de Ventas del Día */}
          {modalHistorial && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-xl w-full p-5 shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">📜 Ventas Realizadas Hoy</h3>
                  <button onClick={() => setModalHistorial(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>

                <div className="grid grid-cols-3 gap-2 text-center text-xs">
                  <div className="bg-stone-950 p-2 rounded-lg border border-stone-800">
                    <span className="text-stone-400 block text-[10px]">Total Ventas</span>
                    <span className="font-bold text-sm text-white">{ventasDelDia.filter(v => !v.anulada).length}</span>
                  </div>
                  <div className="bg-stone-950 p-2 rounded-lg border border-stone-800">
                    <span className="text-stone-400 block text-[10px]">Efectivo</span>
                    <span className="font-bold text-sm text-orange-400">
                      S/ {ventasDelDia.filter(v => !v.anulada && v.medio_pago === 'EFECTIVO').reduce((a, c) => a + Number(c.total_venta), 0).toFixed(2)}
                    </span>
                  </div>
                  <div className="bg-stone-950 p-2 rounded-lg border border-stone-800">
                    <span className="text-stone-400 block text-[10px]">Total General</span>
                    <span className="font-black text-sm text-orange-400">
                      S/ {ventasDelDia.filter(v => !v.anulada).reduce((a, c) => a + Number(c.total_venta), 0).toFixed(2)}
                    </span>
                  </div>
                </div>

                <div className="max-h-64 overflow-y-auto space-y-1.5">
                  {cargandoHistorial ? (
                    <p className="text-xs text-center py-6 text-stone-400">Cargando ventas...</p>
                  ) : ventasDelDia.length === 0 ? (
                    <p className="text-xs text-center py-6 text-stone-500">No hay ventas registradas hoy.</p>
                  ) : (
                    ventasDelDia.map(v => (
                      <div key={v.id} className={`flex justify-between items-center p-2.5 rounded-lg border text-xs ${v.anulada ? 'bg-rose-950/30 border-rose-900/60 opacity-60' : 'bg-stone-950 border-stone-900'}`}>
                        <div>
                          <p className="font-bold text-white font-mono">
                            {v.nro_boleta} - <span className="text-stone-400 font-sans">{v.medio_pago}</span>
                            {v.anulada && <span className="text-rose-400 font-sans"> (ANULADA)</span>}
                          </p>
                          <p className="text-[10px] text-stone-400">{new Date(v.fecha_hora).toLocaleTimeString()} · {v.clientes?.nombre_completo || 'Cliente'}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-black text-orange-400 text-sm">S/ {Number(v.total_venta).toFixed(2)}</span>
                          <button
                            onClick={() => setReciboReimpresion(v)}
                            className="text-[10px] bg-stone-800 hover:bg-stone-800 text-stone-200 px-2 py-1 rounded border border-stone-800"
                            title="Reimprimir boleta"
                          >
                            🖨️
                          </button>
                          {!v.anulada && (
                            <button
                              onClick={() => anularVentaHoy(v)}
                              className="text-[10px] bg-rose-950/80 hover:bg-rose-900 text-rose-300 px-2 py-1 rounded border border-rose-800"
                              title="Anular venta"
                            >
                              Anular
                            </button>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal: Cierre de Caja con Arqueo */}
          {modalCierreCaja && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 text-center">
                <h3 className="text-base font-bold text-white">🔒 Cierre de Turno y Arqueo de Caja</h3>
                <p className="text-xs text-stone-300">Cuenta todo el dinero en efectivo que tienes físicamente en la caja e ingrésalo:</p>
                <input
                  type="number"
                  step="0.50"
                  placeholder="0.00"
                  value={montoConteoEfectivo}
                  onChange={(e) => setMontoConteoEfectivo(e.target.value)}
                  className="w-full bg-stone-950 border border-stone-800 rounded-xl p-2.5 text-center text-xl font-black text-orange-400 focus:outline-none"
                  autoFocus
                />
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setModalCierreCaja(false)} className="flex-1 py-2 bg-stone-800 text-xs font-semibold rounded-lg">Cancelar</button>
                  <button onClick={handleCierreConArqueo} className="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-lg shadow">Confirmar Cierre</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Resumen de Arqueo */}
          {resumenCierre && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 text-center">
                <h3 className="text-base font-bold text-white">📊 Resumen del Turno</h3>
                <div className="bg-stone-950 p-3 rounded-xl border border-stone-900 text-xs space-y-1.5 text-left font-mono">
                  <div className="flex justify-between"><span>Fondo Inicial:</span><span>S/ {resumenCierre.inicio.toFixed(2)}</span></div>
                  <div className="flex justify-between"><span>+ Ventas Efectivo:</span><span>S/ {resumenCierre.ventas.toFixed(2)}</span></div>
                  <div className="border-t border-stone-900 pt-1 flex justify-between font-bold"><span>= Debería haber:</span><span>S/ {resumenCierre.esperado.toFixed(2)}</span></div>
                  <div className="flex justify-between text-orange-400 font-bold"><span>Tú contaste:</span><span>S/ {resumenCierre.real.toFixed(2)}</span></div>
                  <div className={`border-t border-stone-900 pt-1 flex justify-between font-black text-sm ${resumenCierre.diferencia === 0 ? 'text-orange-400' : resumenCierre.diferencia > 0 ? 'text-blue-400' : 'text-rose-400'}`}>
                    <span>Diferencia:</span><span>{resumenCierre.diferencia === 0 ? '✓ Cuadre Perfecto' : `S/ ${resumenCierre.diferencia.toFixed(2)}`}</span>
                  </div>
                </div>
                <button onClick={() => setResumenCierre(null)} className="w-full py-2.5 bg-orange-600 text-white font-bold text-xs rounded-xl">Entendido</button>
              </div>
            </div>
          )}

          {/* Modal: Ventas en Espera */}
          {modalVentasEspera && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">⏸️ Ventas en Espera</h3>
                  <button onClick={() => setModalVentasEspera(false)} className="text-stone-400">✕</button>
                </div>
                <div className="space-y-2 max-h-56 overflow-y-auto">
                  {ventasEnEspera.map((v, i) => (
                    <div key={v.id} className="flex justify-between items-center p-2 bg-stone-950 rounded-lg border border-stone-800 text-xs">
                      <div>
                        <p className="font-bold text-white">🕒 {v.hora} · S/ {v.total.toFixed(2)}</p>
                        <p className="text-[10px] text-stone-400">{v.items.length} ítems</p>
                      </div>
                      <div className="flex gap-1.5">
                        <button onClick={() => recuperarVentaEspera(i)} className="px-2 py-1 bg-orange-600 text-white text-[10px] font-bold rounded">Recuperar</button>
                        <button onClick={() => borrarVentaEspera(i)} className="px-1.5 py-1 bg-rose-900 text-rose-200 text-[10px] rounded">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Modal: Apertura Turno */}
          {modalTurno && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-orange-500/80 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h2 className="text-base font-bold text-white">💼 Apertura de Turno de Caja</h2>
                <div>
                  <label className="text-xs font-semibold text-stone-300 block mb-1">Cajero:</label>
                  <select
                    value={cajeroSeleccionado?.id || ''}
                    onChange={(e) => {
                      const f = listaCajeros.find(c => c.id === e.target.value);
                      if (f) setCajeroSeleccionado(f);
                    }}
                    className="w-full bg-stone-950 border border-stone-800 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    {listaCajeros.map(c => (
                      <option key={c.id} value={c.id}>👤 {c.nombre} ({c.rol || 'Cajero'})</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-stone-300 block mb-1">Monto Inicial (S/):</label>
                  <input
                    type="number"
                    step="1.00"
                    value={montoApertura}
                    onChange={(e) => setMontoApertura(e.target.value)}
                    className="w-full bg-stone-950 border border-stone-800 rounded-xl p-2.5 text-lg font-bold text-white"
                  />
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setModalTurno(false)} className="flex-1 py-2 bg-stone-800 text-xs font-semibold rounded-xl">Cancelar</button>
                  <button onClick={handleAbrirTurno} className="flex-1 py-2 bg-orange-600 text-white text-xs font-bold rounded-xl shadow">Confirmar y Abrir</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Boleta Emitida */}
          {ventaCompletada && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center space-y-3">
                <div className="w-12 h-12 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                <h3 className="text-lg font-black text-white">¡Venta Exitosa!</h3>
                <p className="text-xs text-stone-300 font-mono">Boleta: <span className="text-orange-400 font-bold">{ventaCompletada.nro_boleta}</span></p>
                <div className="bg-stone-950 p-3 rounded-lg text-left text-xs font-mono space-y-1 text-stone-300 border border-stone-900">
                  <p><strong>Pago:</strong> {ventaCompletada.medio_pago}</p>
                  <p><strong>Cliente:</strong> {ventaCompletada.cliente}</p>
                  <div className="border-t border-stone-800 pt-1 mt-1 flex justify-between font-bold text-sm text-orange-400">
                    <span>TOTAL:</span><span>S/ {ventaCompletada.total_venta.toFixed(2)}</span>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex-1 py-2 bg-stone-800 text-white font-bold text-xs rounded-xl">🖨️ Imprimir</button>
                  <button onClick={() => setVentaCompletada(null)} className="flex-1 py-2 bg-orange-600 text-white font-bold text-xs rounded-xl shadow">Nueva Venta</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: QR de Pago (Yape/Plin) */}
          {medioQR && (
            <QRPagoModal
              bodegaId={bodegaId}
              medioPago={medioQR}
              monto={totalVenta}
              onClose={() => setMedioQR(null)}
            />
          )}

          {/* Modal: Reimpresión de Boleta desde el Historial */}
          {reciboReimpresion && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
              <div className="bg-stone-900 border border-stone-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center space-y-3">
                <div className="w-12 h-12 bg-stone-800 text-stone-200 rounded-full flex items-center justify-center mx-auto text-xl">🖨️</div>
                <h3 className="text-lg font-black text-white">Reimpresión de Boleta</h3>
                <p className="text-xs text-stone-300 font-mono">Boleta: <span className="text-orange-400 font-bold">{reciboReimpresion.nro_boleta}</span></p>
                {reciboReimpresion.anulada && (
                  <p className="text-xs font-bold text-rose-400">⚠️ Esta venta está ANULADA</p>
                )}
                <div className="bg-stone-950 p-3 rounded-lg text-left text-xs font-mono space-y-1 text-stone-300 border border-stone-900 max-h-56 overflow-y-auto">
                  <p><strong>Pago:</strong> {reciboReimpresion.medio_pago}</p>
                  <p><strong>Cliente:</strong> {reciboReimpresion.clientes?.nombre_completo || 'Cliente'}</p>
                  {(reciboReimpresion.ventas_detalle || []).length > 0 ? (
                    <div className="border-t border-stone-800 pt-1 mt-1 space-y-0.5">
                      {reciboReimpresion.ventas_detalle.map((d, i) => (
                        <div key={i} className="flex justify-between">
                          <span>{d.productos?.descripcion || 'Producto'} x{d.cantidad}</span>
                          <span>S/ {Number(d.subtotal).toFixed(2)}</span>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-stone-500 border-t border-stone-800 pt-1 mt-1">Sin detalle de productos disponible.</p>
                  )}
                  <div className="border-t border-stone-800 pt-1 mt-1 flex justify-between font-bold text-sm text-orange-400">
                    <span>TOTAL:</span><span>S/ {Number(reciboReimpresion.total_venta).toFixed(2)}</span>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex-1 py-2 bg-stone-800 text-white font-bold text-xs rounded-xl">🖨️ Imprimir</button>
                  <button onClick={() => setReciboReimpresion(null)} className="flex-1 py-2 bg-orange-600 text-white font-bold text-xs rounded-xl shadow">Cerrar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PosApp />);
  </script>
</body>
</html>
