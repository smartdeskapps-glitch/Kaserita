name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
