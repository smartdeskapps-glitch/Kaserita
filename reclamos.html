<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Libro de Reclamaciones - Kaserita</title>
<meta name="description" content="Libro de Reclamaciones virtual de Kaserita." />
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf8f6; --card: #ffffff; --ink: #1c1523; --muted: #6f6779; --line: #e9e3ee;
    --violet: #7c3aed; --violet-ink: #5b21b6; --blue: #2563eb; --emerald: #059669; --emerald-bg: #ecfdf5;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 56px; }

  .topbar { display: flex; align-items: center; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: linear-gradient(135deg, var(--blue), var(--violet)); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(124,58,237,.45); }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand-name { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand-name span { color: var(--violet); }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2.seccion { font-family: var(--font-display); font-weight: 700; font-size: 14px; margin: 24px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  h2.seccion:first-of-type { border-top: none; padding-top: 0; margin-top: 18px; }
  .screen-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.55; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink); }
  .field input, .field textarea {
    font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--line); border-radius: 11px; padding: 10.5px 13px; outline: none; transition: border-color .15s ease; width: 100%; resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--violet); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

  .checkbox-line { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: var(--muted); margin: 4px 0 6px; cursor: pointer; }
  .checkbox-line input { margin-top: 2px; }

  .tipo-row { display: flex; flex-direction: column; gap: 10px; }
  .tipo-opt { display: flex; flex-direction: column; gap: 2px; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: var(--font-display); }
  .tipo-opt span { font-size: 11px; font-weight: 500; font-family: var(--font-body); color: var(--muted); }
  .tipo-opt.sel { border-color: var(--violet); background: rgba(124,58,237,.06); }
  .tipo-opt input { margin-right: 8px; }

  .error-box { font-size: 12px; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }

  .pay-btn {
    width: 100%; background: linear-gradient(120deg, var(--blue), var(--violet)); color: #fff;
    font-family: var(--font-display); font-weight: 700; font-size: 14.5px; border: none; border-radius: 13px; padding: 14px; cursor: pointer;
    margin-top: 6px; box-shadow: 0 10px 24px -10px rgba(124,58,237,.5);
  }
  .pay-btn:disabled { opacity: .5; cursor: default; }
  .fine-print { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }
  .fine-print a { color: var(--violet-ink); }

  .center-block { text-align: center; padding: 30px 20px; }
  .success-badge { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%; background: var(--emerald-bg); color: var(--emerald); display: flex; align-items: center; justify-content: center; }
  .success-badge svg { width: 24px; height: 24px; }
  .codigo { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--violet-ink); letter-spacing: 0.02em; margin: 6px 0 18px; }

  .back { display: block; text-align: center; font-size: 13px; color: var(--muted); text-decoration: none; margin-top: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/reclamos.jsx"></script>
</body>
</html>
